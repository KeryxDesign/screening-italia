document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n{background:linear-gradient(180deg,#12664F 0%,#0A4739 100%);border-color:var(--verde-scuro);color:#fff;\n  box-shadow:0 3px 8px rgba(1,40,32,0.22),inset 0 1px 0 rgba(255,255,255,0.14)}\n.scelta.on:hover{background:var(--verde-scuro)}\n.scelta.on .scelta-n{color:#D9E9E1}\n.scelta-txt{display:flex;flex-direction:column;gap:2px;min-width:0}\n.scelta-nome{font-size:19px;font-weight:700;line-height:1.25}\n.scelta-n{font-size:17px;color:var(--soft);line-height:1.3}\n.tag-tipo{background:#fff;color:var(--soft);border-color:var(--bordo)}\nhtml.contrasto .scelta-icona{color:#000}\n\n/* --- Come funziona: tre passi --- */\n.passi{display:flex;flex-direction:column;gap:22px;margin:0;padding:0;list-style:none}\n.passo{display:flex;gap:16px;align-items:flex-start}\n.passo .num{flex-shrink:0;width:40px;height:40px;border-radius:999px;\n  background:linear-gradient(180deg,#12664F 0%,#0A4739 100%);color:#fff;\n  box-shadow:0 2px 6px rgba(1,40,32,0.22),inset 0 1px 0 rgba(255,255,255,0.14);\n  font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}\n.passo-txt{display:flex;flex-direction:column;gap:4px;padding-top:4px;min-width:0}\n.passo-tit{font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-0.008em}\n.passo-desc{font-size:18px;color:var(--soft);line-height:1.5;max-width:52ch}\n.passo p{padding-top:7px}\n\n/* --- Accessibilita: ingrandimento del testo e contrasto --- */\nhtml.txt-g body{overflow-x:clip;zoom:1.15}\nhtml.txt-xg body{overflow-x:clip;zoom:1.32}\n\nhtml.contrasto{\n  --carta:#FFFFFF; --carta2:#FFFFFF; --inchiostro:#000000; --soft:#141414;\n  --verde:#00453A; --verde-scuro:#00291F; --verde-tenue:#FFFFFF;\n  --terracotta:#8A2600; --bordo:#000000;\n}\nhtml.contrasto .banda{background:#fff !important;box-shadow:0 0 0 100vmax #fff !important}\nhtml.contrasto .card,html.contrasto .avviso,html.contrasto .elenco,\nhtml.contrasto .campo,html.contrasto .scelta,html.contrasto .filtro,\nhtml.contrasto .tag,html.contrasto .mappa-nome{border-width:2.5px;border-color:#000;background:#fff}\nhtml.contrasto .finto{background:#fff;border-color:#000;color:#000}\nhtml.contrasto .mappa path.vuota{fill:#fff;stroke:#000;stroke-width:1.5}\nhtml.contrasto .mappa path.piena{fill:#2F7A63;stroke:#000;stroke-width:1.8}\nhtml.contrasto a{text-decoration-thickness:2.5px}\nhtml.contrasto .sep{border-top-color:#000}\nhtml.contrasto .scelta.on,html.contrasto .filtro.on{background:#00453A;color:#fff}\nhtml.contrasto .scelta.on .scelta-icona{color:#fff}\nhtml.contrasto .scelta.on .scelta-n{color:#fff}\n\n.a11y{position:fixed;left:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;align-items:flex-start;gap:10px}\n.a11y-apri{width:56px;height:56px;border-radius:999px;border:2px solid #fff;\n  background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;\n  cursor:pointer;box-shadow:0 6px 18px rgba(1,18,30,0.28)}\n.a11y-apri:hover{background:var(--verde-scuro)}\n.a11y-apri:focus-visible{outline:3px solid var(--terracotta);outline-offset:3px}\n.a11y-pannello[hidden]{display:none}\n.a11y-pannello{width:266px;background:#fff;border:1.5px solid var(--bordo);border-radius:12px;\n  padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 28px rgba(1,18,30,0.24)}\n.a11y-tit{font-size:17px;font-weight:700;color:var(--soft)}\n.a11y-riga{display:flex;gap:8px}\n.a11y-scelta{min-height:52px;min-width:52px;flex:1;font-family:inherit;font-size:19px;font-weight:700;\n  background:#fff;color:var(--inchiostro);border:1.5px solid var(--bordo);border-radius:8px;cursor:pointer;\n  display:flex;align-items:center;justify-content:center}\n.a11y-scelta:hover{border-color:var(--verde);background:var(--verde-tenue)}\n.a11y-scelta.on{background:var(--verde);color:#fff;border-color:var(--verde)}\n.a11y-scelta.larga{width:100%;font-size:17px;padding:0 12px}\n.a11y-chiudi{min-height:48px;font-family:inherit;font-size:17px;font-weight:700;background:none;\n  border:0;color:var(--verde);cursor:pointer;text-decoration:underline;text-underline-offset:3px}\n\n/* Respiro tra un testo e il bottone che lo segue. */\n.cta:not(:first-child),.cta-2:not(:first-child),.tel:not(:first-child){margin-top:8px}\n.scelte{margin-top:4px}\n.card{padding:22px}\n\n/* Le utility di spaziatura mancanti: senza queste le card restano compresse. */\n.gap4{gap:4px}.gap6{gap:6px}.gap14{gap:14px}.gap18{gap:18px}.gap20{gap:20px}.gap28{gap:28px}.gap32{gap:32px}\n.card > h3{margin-top:2px}\n\n.card > h3{color:var(--azzurro);font-size:26px;line-height:1.24;letter-spacing:-0.012em;font-weight:700;margin-top:8px}\n@media (min-width:860px){.card > h3{font-size:30px}}\n\n/* Cambio regione dalla pagina delle iniziative */\n.etichetta-sel{font-size:17px;font-weight:700;color:var(--soft)}\n.sel-box{position:relative;display:flex;align-items:center}\n.campo-sel{appearance:none;-webkit-appearance:none;padding:14px 52px 14px 16px;font-weight:700;cursor:pointer}\n.sel-frecciona{position:absolute;right:16px;color:var(--verde);pointer-events:none}\n\n/* Scelta della regione nella pagina delle iniziative */\n.scelta-reg{display:flex;flex-direction:column;gap:20px}\n.mappa-piccola{max-width:none;margin:0}\n@media (min-width:860px){.mappa-piccola{max-width:520px;margin:0 auto}}\n.mappa path.attiva{fill:var(--terracotta);stroke:var(--inchiostro);stroke-width:2}\nhtml.contrasto .mappa path.attiva{fill:#8A2600;stroke:#000;stroke-width:2.5}\n\n/* --- Card articolo (domande frequenti) --- */\n.art-griglia{display:grid;grid-template-columns:1fr;gap:18px}\n@media (min-width:640px){.art-griglia{grid-template-columns:1fr 1fr;gap:20px}}\n.art{display:flex;flex-direction:column;background:#fff;border:0;border-radius:14px;overflow:hidden;\n  color:var(--inchiostro);box-shadow:0 1px 2px rgba(4,40,64,0.06),0 6px 18px rgba(4,40,64,0.10);\n  transition:transform .18s ease,box-shadow .18s ease}\n.art:hover,.art:focus-within{transform:translateY(-2px);\n  box-shadow:0 2px 4px rgba(4,40,64,0.08),0 14px 30px rgba(4,40,64,0.16)}\n.art .art-img{border-radius:0}\n.art-tit a{color:var(--inchiostro);text-decoration:none}\n.art-tit a:hover,.art-tit a:focus-visible{color:var(--verde);text-decoration:underline;text-underline-offset:3px}\n.art-img{display:block;width:100%;aspect-ratio:16 / 9}\n.art-corpo{display:flex;flex-direction:column;gap:8px;padding:18px 20px 18px}\n.art-meta{font-size:16px;color:var(--soft);line-height:1.3}\n.art-tit{font-size:21px;font-weight:600;line-height:1.3;max-width:none}\n.art-som{font-size:17px;color:var(--soft);line-height:1.5;max-width:none}\n.art-vai{margin-top:2px;min-height:44px;font-size:17px;font-weight:700;color:var(--verde);\n  display:inline-flex;align-items:center;gap:7px;text-decoration:none;align-self:flex-start}\n.art-vai:hover{color:var(--verde-scuro);text-decoration:underline;text-underline-offset:3px}\nhtml.contrasto .art{border:2.5px solid #000;background:#fff;box-shadow:none}\n\n/* Immagine di apertura */\n.foto-apertura{width:100%;aspect-ratio:16 / 9;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(4,40,64,0.16)}\n@media (min-width:860px){.foto-apertura{aspect-ratio:21 / 9}}\n\n\nhtml.contrasto .hdr{background:#00291F}\nhtml.contrasto .ftr{background:#00291F}\nhtml.contrasto .cta,html.contrasto .tel,html.contrasto .scelta.on,html.contrasto .filtro.on{background:#00453A;box-shadow:none}\nhtml.contrasto .cta{background:#8A2600}\nhtml.contrasto .card,html.contrasto .cta-2{background:#fff;box-shadow:none}\nhtml.contrasto .mappa svg{filter:none}\n\n/* I titoli dentro le card e gli avvisi restano allineati a sinistra */\n.card h2,.avviso h2,.art h2{text-align:left;margin-left:0;color:var(--inchiostro)}\nhtml.contrasto h2{color:#00291F}\n\n/* --- Apertura con fotografia di sfondo a tutta fascia --- */\n.hero{position:relative;color:#fff;padding-top:84px;padding-bottom:84px;isolation:isolate}\n.hero::before{display:none}\n.hero-sfondo{position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);\n  z-index:-1;overflow:hidden;background:#0A4739}\n.hero-sfondo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}\n.hero-sfondo image-slot{width:100%;height:100%;display:block}\n.hero-velo{position:absolute;inset:0;\n  background:linear-gradient(180deg,rgba(2,28,22,0.78) 0%,rgba(2,28,22,0.52) 50%,rgba(2,28,22,0.74) 100%)}\n.hero h1{color:#fff;max-width:18ch;text-shadow:0 2px 14px rgba(0,0,0,0.45)}\n.hero p{color:#EDF5F2;max-width:50ch;text-shadow:0 1px 8px rgba(0,0,0,0.4)}\n.hero .occhiello{color:#A9E2CD}\n@media (min-width:860px){.hero{padding-top:128px;padding-bottom:128px}}\nhtml.contrasto .hero-sfondo img{display:none}\nhtml.contrasto .hero-velo{background:#00291F}\nhtml.contrasto .hero h1,html.contrasto .hero p{text-shadow:none}\n\n/* --- Comparsa in scorrimento: attiva solo con JS, disattivata su richiesta --- */\nhtml.js-anim .rivela{opacity:0;transform:translateY(18px)}\nhtml.js-anim .rivela.dentro{opacity:1;transform:none;\n  transition:opacity .5s ease,transform .5s cubic-bezier(.22,.68,.3,1)}\nhtml.js-anim .rivela.d1.dentro{transition-delay:.08s}\nhtml.js-anim .rivela.d2.dentro{transition-delay:.16s}\nhtml.js-anim .rivela.d3.dentro{transition-delay:.24s}\n@media (prefers-reduced-motion:reduce){\n  html.js-anim .rivela{opacity:1 !important;transform:none !important;transition:none !important}\n}\n.hero h1,.hero p,.hero .occhiello,.hero .cta{position:relative}\nhtml.js-anim .hero-sfondo img{animation:respiro 18s ease-in-out infinite alternate}\n@keyframes respiro{from{transform:scale(1)}to{transform:scale(1.06)}}\n@media (prefers-reduced-motion:reduce){html.js-anim .hero-sfondo img{animation:none}}\n\n/* --- Icone nei dati della scheda --- */\n.dato .et{display:inline-flex;align-items:center;gap:7px}\n.dato .et svg{width:16px;height:16px;flex-shrink:0;color:var(--azzurro)}\n.passo-tit{display:flex;align-items:center;gap:9px}\n.passo-tit svg{width:20px;height:20px;flex-shrink:0;color:var(--verde)}\nhtml.contrasto .dato .et svg,html.contrasto .passo-tit svg{color:#000}\n\n/* --- WhatsApp: invito primario --- */\n.wa{display:flex;align-items:center;gap:16px;min-height:76px;padding:16px 22px;border-radius:14px;\n  align-self:center;\n  background:linear-gradient(180deg,#0E7C41 0%,#0B6B37 100%);color:#fff;text-decoration:none;\n  box-shadow:0 4px 14px rgba(6,60,32,0.3),inset 0 1px 0 rgba(255,255,255,0.18);\n  transition:transform .14s ease,box-shadow .14s ease;align-self:center;width:100%;max-width:34rem}\n.wa:hover{color:#fff;transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,60,32,0.36);text-decoration:none}\n.wa:active{transform:none}\n.wa-i{width:38px;height:38px;flex-shrink:0;color:#fff}\n.wa-txt{display:flex;flex-direction:column;gap:3px;min-width:0}\n.wa-tit{font-size:21px;font-weight:700;line-height:1.2;color:#fff}\n.wa-sub{font-size:16px;line-height:1.35;color:#EAFBF0}\n.sep-o{display:flex;align-items:center;gap:14px;color:var(--soft);font-size:16px;max-width:34rem}\n.sep-o::before,.sep-o::after{content:\"\";flex:1;height:1.5px;background:var(--bordo)}\nhtml.contrasto .wa{background:#005C2E;box-shadow:none;border:2.5px solid #000}\nhtml.contrasto .wa-tit,html.contrasto .wa-sub,html.contrasto .wa-i{color:#fff}\n\n/* --- Modulo di contatto --- */\n.modulo{max-width:34rem;align-self:center;width:100%}\n.campo-area{min-height:132px;padding:14px 16px;line-height:1.5;resize:vertical}\n\n/* Link dentro un hero scuro: chiari, non verdi */\n.hero a{color:#FFFFFF;text-decoration-color:rgba(255,255,255,0.6)}\n.hero a:hover{color:#A9E2CD;text-decoration-color:#A9E2CD}\n.hero .nota{color:#DCEAE5}\nhtml.contrasto .hero a{color:#fff}\n\n/* --- Barra dei sostenitori --- */\n.b-pieno{background:#04251E;box-shadow:0 0 0 100vmax #04251E}\n.sezione-bassa{padding-top:30px;padding-bottom:30px}\n@media (min-width:860px){.sezione-bassa{padding-top:40px;padding-bottom:40px}}\n.trust-occhiello{font-size:15px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;\n  color:#8FD3B9;text-align:center;margin:0 auto;max-width:none}\n.trust-riga{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;\n  gap:clamp(8px,2.2vw,34px);width:100%;min-width:0}\n.trust-riga::-webkit-scrollbar{display:none}\n.trust-logo{display:flex;align-items:center;gap:clamp(5px,0.9vw,9px);color:#fff;opacity:0.94;min-width:0;flex:0 1 auto}\n.trust-marchio{width:clamp(22px,2.9vw,38px);height:clamp(22px,2.9vw,38px);flex-shrink:0}\n.trust-nome{font-size:clamp(9px,1.15vw,15px);font-weight:600;line-height:1.2;letter-spacing:0.01em;\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.trust-nota{font-size:14px;color:#9FBDB2;text-align:center;margin:0 auto;max-width:none}\nhtml.contrasto .b-pieno{background:#fff !important;box-shadow:0 0 0 100vmax #fff !important}\nhtml.contrasto .trust-occhiello,html.contrasto .trust-nota{color:#111}\nhtml.contrasto .trust-logo{color:#111}\n\n\n/* --- Pulsanti d'azione: aspetto unico e centrato --- */\n.cta-2{\n  background:linear-gradient(180deg,#BE4A1E 0%,#A63D17 100%);color:#fff;border:none;\n  box-shadow:0 2px 6px rgba(120,44,16,0.28),inset 0 1px 0 rgba(255,255,255,0.18);\n}\n.cta-2:hover{background:linear-gradient(180deg,#A83F16 0%,#8A3212 100%);color:#fff;\n  transform:translateY(-1px);box-shadow:0 6px 14px rgba(120,44,16,0.3)}\n.cta-2:active{transform:none;box-shadow:0 1px 3px rgba(120,44,16,0.3)}\n.banda:not(.hero) .cta,.banda:not(.hero) .cta-2{align-self:center}\n.avviso .cta,.avviso .cta-2,.avviso .tel,.card .cta,.card .cta-2,.card .tel{align-self:center}\n.hero .cta,.hero .cta-2{align-self:flex-start}\nhtml.contrasto .cta-2{background:#8A2600;color:#fff;border:2.5px solid #000;box-shadow:none}\n\n/* --- Testimonianze --- */\n.carrellata,.testi-griglia{display:grid;grid-template-columns:1fr;gap:20px}\n@media (min-width:860px){.carrellata,.testi-griglia{grid-template-columns:1fr 1fr;gap:24px}}\n@media (min-width:1280px){.carrellata,.testi-griglia{grid-template-columns:repeat(3,1fr)}}\n/* La fascia delle testimonianze usa una colonna piu larga della colonna di lettura */\n.banda-larga{max-width:1040px}\n@media (min-width:1280px){.banda-larga{max-width:1200px}}\n@media (min-width:1280px){.testi-txt{font-size:17px}}\n.testi{display:flex;flex-direction:column;gap:12px;margin:0;padding:24px 26px;\n  background:#fff;border:0;border-radius:14px;box-shadow:none}\n.testi-virg{width:30px;height:30px;flex-shrink:0;color:#8FB8A6}\n.testi-txt{margin:0;font-size:18px;line-height:1.55;color:var(--inchiostro);max-width:none}\n.testi-chi{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:4px}\n.testi-nome{font-size:17px;font-weight:700}\n.testi-ruolo{font-size:16px;color:var(--soft)}\n\nhtml.contrasto .testi-virg{color:#000}\nhtml.contrasto .testi-ruolo{color:#000}\n\n/* --- Floater WhatsApp --- */\n.wa-float{position:fixed;right:16px;bottom:18px;z-index:60;\n  display:flex;align-items:center;gap:10px;min-height:56px;padding:0 20px 0 16px;\n  border-radius:999px;background:linear-gradient(180deg,#0E7C41 0%,#0B6B37 100%);\n  color:#fff;font-size:17px;font-weight:700;text-decoration:none;\n  box-shadow:0 6px 18px rgba(6,60,32,0.36),inset 0 1px 0 rgba(255,255,255,0.2);\n  transition:transform .14s ease,box-shadow .14s ease}\n.wa-float svg{width:28px;height:28px;flex-shrink:0}\n.wa-float:hover{color:#fff;text-decoration:none;transform:translateY(-2px);\n  box-shadow:0 12px 26px rgba(6,80,40,0.4)}\n.wa-float:active{transform:none}\nhtml.contrasto .wa-float{background:#005C2E;border:2.5px solid #000;box-shadow:none;color:#fff}\n@media print{.wa-float{display:none}}\n\n/* --- Carosello infinito (solo in home) --- */\n.carosello{overflow:hidden;width:100%;\n  mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);\n  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}\n.car-pista{display:flex;width:max-content;animation:scorri 72s linear infinite}\n.carosello:hover .car-pista,.carosello:focus-within .car-pista{animation-play-state:paused}\n.car-pista > .testi{width:310px;flex:0 0 310px;margin-right:20px}\n@media (min-width:860px){.car-pista > .testi{width:380px;flex:0 0 380px;margin-right:24px}}\n@keyframes scorri{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n@media (prefers-reduced-motion:reduce){\n  .car-pista{animation:none;overflow-x:auto;width:100%}\n  .carosello{mask-image:none;-webkit-mask-image:none}\n}\n\n/* --- Ritratto nella testimonianza --- */\n.testi-testa{display:flex;align-items:center;gap:14px}\n.testi-foto{display:block;width:62px;height:62px;flex-shrink:0;border-radius:999px;overflow:hidden;background:var(--carta2)}\n.testi-foto image-slot{width:100%;height:100%;display:block}\n.testi-chi{margin-top:0;padding-top:0}\nhtml.contrasto .testi-foto{border:2.5px solid #000}\n\n/* --- Numeri del portale --- */\n.numeri{display:grid;grid-template-columns:1fr 1fr;gap:22px 18px}\n@media (min-width:860px){.numeri{grid-template-columns:repeat(4,1fr);gap:24px}}\n.numero{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}\n.numero-n{display:flex;align-items:center;min-height:40px;font-size:40px;font-weight:700;line-height:1;letter-spacing:-0.02em;\n  color:var(--verde-scuro);font-variant-numeric:tabular-nums}\n.numero-data{font-size:22px;letter-spacing:-0.005em;white-space:nowrap}\n@media (min-width:860px){.numero-data{font-size:26px}}\n.numero-et{font-size:16px;line-height:1.3;color:var(--soft);max-width:16ch}\nhtml.contrasto .numero-n{color:#000}\nhtml.contrasto .numero-et{color:#000}\n\n/* L'occhiello di sezione segue l'allineamento del titolo che introduce */\n.banda:not(.hero) .occhiello{text-align:center}\n\n/* Nelle fasce con titolo centrato, anche l'introduzione sta al centro.\n   Il contenuto (card, elenchi, note dei campi) resta allineato a sinistra. */\n.banda:not(.hero) .fx:not(.lettura):has(> h2) > p,\n.banda:not(.hero) .fx:not(.lettura):has(> h2) > .nota,\n.banda:not(.hero) .fx:not(.lettura):has(> h2) > .finto,\n.banda:not(.hero) .fx:not(.lettura):has(> .occhiello) > .finto{\n  text-align:center;margin-left:auto;margin-right:auto\n}\n.banda:not(.hero) .fx:has(> h2) > .finto{max-width:44rem}\n\n/* --- Numeri dentro l'hero --- */\n.numeri-hero{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin-top:8px;\n  padding-top:22px;border-top:1.5px solid rgba(255,255,255,0.28);width:100%;max-width:34rem}\n@media (min-width:860px){.numeri-hero{grid-template-columns:repeat(4,1fr);gap:24px;max-width:44rem}}\n.numero-h{display:flex;flex-direction:column;gap:3px}\n.numero-hn{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-0.015em;color:#fff;\n  font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(0,0,0,0.4);white-space:nowrap}\n.numero-het{font-size:15px;line-height:1.25;color:#E4F1EB;text-shadow:0 1px 6px rgba(0,0,0,0.4)}\nhtml.contrasto .numeri-hero{border-top-color:#fff}\n\n/* --- Colonna di lettura degli articoli --- */\n.lettura{max-width:38rem;margin:0 auto}\n.lettura-tit{font-size:24px;line-height:1.28;text-align:left;margin-left:0;max-width:28ch}\n@media (min-width:860px){.lettura-tit{font-size:27px}}\n.lettura-p{font-size:19px;line-height:1.66;max-width:none}\n@media (min-width:860px){.lettura-p{font-size:20px}}\n\n/* --- Articoli: impaginazione da testata --- */\n.art-testa{padding-bottom:8px}\n.sezione-corpo{padding-top:28px;padding-bottom:52px}\n@media (min-width:860px){.sezione-corpo{padding-top:36px;padding-bottom:76px}}\n.gap28{gap:28px}\n.art-testa .lettura,.sezione-corpo .lettura{max-width:38rem}\n.art-torna{text-align:left}\n.art-cat{font-size:15px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;\n  color:var(--terracotta);max-width:none}\n.art-headline{text-align:left;max-width:26ch;font-size:33px;line-height:1.15;letter-spacing:-0.018em}\n@media (min-width:860px){.art-headline{font-size:44px}}\n.art-standfirst{font-size:21px;line-height:1.5;color:#2C3A34;max-width:44ch}\n@media (min-width:860px){.art-standfirst{font-size:23px}}\n.art-firma{font-size:16px;color:var(--soft);max-width:none;\n  padding-top:14px;border-top:1.5px solid var(--bordo)}\n.art-figura{margin:8px 0 0;display:flex;flex-direction:column;gap:8px}\n.art-figura-img{display:block;width:100%;aspect-ratio:16 / 9;border-radius:10px;overflow:hidden;background:var(--carta2)}\n.art-figura-img image-slot{width:100%;height:100%;display:block}\n.art-didascalia{font-size:15px;color:var(--soft);line-height:1.4}\n.art-sez{scroll-margin-top:80px}\n.art-sub{text-align:left;margin-left:0;max-width:30ch;font-size:24px;line-height:1.26;\n  letter-spacing:-0.01em;color:var(--verde-scuro)}\n@media (min-width:860px){.art-sub{font-size:28px}}\n.art-p{text-align:left;font-size:19px;line-height:1.68;max-width:none;text-wrap:pretty}\n@media (min-width:860px){.art-p{font-size:20px}}\n.art-chiave{margin-top:2px}\n.art-chiave mark{background:#F7E7B8;color:#1A1A1A;padding:2px 5px;border-radius:3px;\n  box-decoration-break:clone;-webkit-box-decoration-break:clone}\n.art-aside{font-size:18px;line-height:1.55;color:#2C3A34;max-width:none;\n  padding-left:16px;border-left:3px solid var(--verde-tenue)}\n.art-avvertenza{font-size:16px;line-height:1.5;color:var(--soft);max-width:none;\n  padding-top:18px;border-top:1.5px solid var(--bordo)}\nhtml.contrasto .art-cat{color:#8A2600}\nhtml.contrasto .art-sub{color:#000}\nhtml.contrasto .art-chiave mark{background:#FFE680;color:#000}\nhtml.contrasto .art-aside{border-left-color:#000;color:#000}\n\n/* Corpo degli articoli: sempre a sinistra, senza eccezioni */\n.lettura,.lettura *,.art-p,.art-aside,.art-chiave,.art-avvertenza,.art-didascalia{\n  text-align:left !important;margin-left:0 !important;margin-right:0 !important\n}\n.lettura{margin-left:auto !important;margin-right:auto !important}\n\n/* ============ Ottimizzazione per telefono ============ */\n@media (max-width:699px){\n  /* Respiro delle fasce: meno alto, il pollice arriva prima al contenuto */\n  .hero{padding-top:52px;padding-bottom:52px}\n  .sezione{padding-top:40px;padding-bottom:40px}\n  .sezione-bassa{padding-top:26px;padding-bottom:26px}\n\n  /* Titoli: scala ridotta ma sempre sopra il pavimento di leggibilita */\n  h1{font-size:28px;letter-spacing:-0.01em}\n  h2{font-size:25px}\n  .art-headline{font-size:29px;line-height:1.18}\n  .art-standfirst{font-size:19px}\n  .art-sub{font-size:22px}\n  .art-p{font-size:18px;line-height:1.62}\n  .hero p{font-size:18px}\n\n  /* Loghi dei sostenitori: due righe leggibili invece di una riga minuscola */\n  .trust-riga{flex-wrap:wrap;justify-content:center;gap:14px 20px}\n  .trust-logo{flex:0 0 auto}\n  .trust-nome{font-size:14px;white-space:normal;line-height:1.15}\n  .trust-marchio{width:28px;height:28px}\n\n  /* Numeri nell'hero: due colonne, cifre piu contenute */\n  .numeri-hero{gap:16px 18px;padding-top:18px}\n  .numero-hn{font-size:26px}\n  .numero-het{font-size:14px}\n\n  /* Carosello: card piu strette, scorrimento piu lento da leggere */\n  .car-pista{animation-duration:96s}\n  .car-pista > .testi{width:270px;flex:0 0 270px;margin-right:16px}\n  .testi{padding:20px}\n  .testi-txt{font-size:17px}\n\n  /* Bersagli d'azione a tutta larghezza: piu facili da centrare col pollice */\n  .cta,.cta-2{width:100%;justify-content:center;text-align:center}\n  .banda:not(.hero) .cta,.banda:not(.hero) .cta-2{align-self:stretch}\n  .wa{padding:14px 18px;gap:12px}\n  .wa-tit{font-size:19px}\n  .wa-sub{font-size:15px}\n\n  /* Floater: solo icona, non copre il testo */\n  .wa-float{right:12px;bottom:12px;min-height:52px;padding:0 14px}\n  .wa-float span{display:none}\n  .wa-float svg{width:26px;height:26px}\n\n  /* Spazio in fondo alla pagina per i due pulsanti flottanti */\n  .ftr{padding-bottom:84px}\n\n  /* Articoli e schede: margini interni piu sobri */\n  .card{padding:20px}\n  .art-corpo{padding:16px 16px 16px}\n  .modulo{max-width:none}\n  .lettura{max-width:none}\n}\n@media (max-width:389px){\n  .trust-nome{font-size:13px}\n  h1{font-size:26px}\n  .numeri-hero{grid-template-columns:1fr 1fr;gap:14px}\n}\n\n/* Secondo invito come collegamento, non come secondo pulsante */\n.link-cta{display:inline-flex;align-items:center;gap:8px;min-height:44px;\n  font-size:18px;font-weight:700;color:var(--verde-scuro);\n  text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}\n.link-cta:hover{color:var(--verde);text-decoration-thickness:3px}\n.banda:not(.hero) .link-cta{align-self:center}\nhtml.contrasto .link-cta{color:#000}\n@media (max-width:699px){.link-cta{align-self:center;text-align:center}}\n\n/* --- Scadenze: quanto resta per aderire --- */\n/* Le pastiglie PIENE restano al costo (gratuito / a pagamento / su invito).\n   Le scadenze hanno un trattamento riservato: fondo trasparente e contorno,\n   cosi non si confondono con i tag di stato nella stessa card. */\n.scad{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;\n  font-size:15px;font-weight:700;line-height:1.25;background:transparent;\n  border:1.5px solid currentColor;white-space:nowrap}\n.scad svg{width:15px;height:15px;flex-shrink:0}\n/* L'unica scadenza con un fondo e quella imminente: e l'unica rossa della pagina. */\n.scad-rossa{background:#FBE7E2;color:#8A2411;border-width:2px}\n.scad-gialla{color:#0A4A72}\n.scad-calma{color:#3A4A44;border-color:transparent;font-weight:600;padding-left:2px;padding-right:2px}\n.scad-posti{color:#4A2E05;border-style:dashed}\n.scad-chiusa{color:#3A3A3A;border-color:rgba(58,58,58,0.45)}\n.urgenza{display:flex;align-items:center;gap:9px;justify-content:center;\n  font-size:18px;font-weight:700;color:#8A2411;max-width:none}\n.urgenza svg{flex-shrink:0}\nhtml.contrasto .scad{background:#fff;color:#000;border-color:#000;border-width:2.5px;border-style:solid}\nhtml.contrasto .scad-posti{border-style:dashed}\nhtml.contrasto .urgenza{color:#000}\n@media (max-width:699px){.scad{font-size:14px;padding:4px 9px}.urgenza{font-size:17px}}\n\n:root{--azzurro:#0B3C5D}\n.card .nota{font-size:16px;color:#46534D}\n.card .fx.col.gap8{gap:12px}\nhtml.contrasto .card{background:#fff;border:2.5px solid #000;box-shadow:none}\nhtml.contrasto .card > h3{color:#000}\nhtml.contrasto .dato{border-bottom-color:#000}\nhtml.contrasto .dato .et svg{color:#000}\nhtml.contrasto .tel{background:#00243A}\n@media (max-width:699px){\n  .card{padding:20px}\n  .card > h3{font-size:24px}\n  .dato{grid-template-columns:1fr;gap:2px;padding-bottom:12px}\n  .dato .et{padding-top:0}\n}\n\n/* ============ Bottoni gialli sfumati ============ */\n.tel{\n  background:linear-gradient(180deg,#FFD34F 0%,#F0A800 100%) !important;\n  color:#14100A !important;\n  border:none !important;\n  box-shadow:0 2px 6px rgba(122,80,0,0.24),inset 0 1px 0 rgba(255,255,255,0.5) !important;\n}\n.tel:hover{\n  background:linear-gradient(180deg,#FFC93D 0%,#E09A00 100%) !important;\n  color:#14100A !important;\n  transform:translateY(-1px);\n  box-shadow:0 7px 16px rgba(122,80,0,0.28),inset 0 1px 0 rgba(255,255,255,0.5) !important;\n}\n/* L'invito principale del sito resta terracotta: alterna col giallo delle schede. */\n.cta{\n  background:linear-gradient(180deg,#B0431A 0%,#93330F 100%) !important;\n  color:#fff !important;border:none !important;\n  box-shadow:0 2px 6px rgba(120,44,16,0.3),inset 0 1px 0 rgba(255,255,255,0.18) !important;\n}\n.cta:hover{\n  background:linear-gradient(180deg,#9A3512 0%,#7F2A0B 100%) !important;\n  color:#fff !important;transform:translateY(-1px);\n  box-shadow:0 7px 16px rgba(120,44,16,0.32) !important;\n}\n.cta:active,.tel:active{transform:none;box-shadow:0 1px 3px rgba(80,40,16,0.3) !important}\n.cta-2{\n  background:linear-gradient(180deg,#FFFFFF 0%,#F4F7FA 100%) !important;\n  color:var(--azzurro) !important;\n  border:none !important;\n  box-shadow:0 1px 3px rgba(4,40,64,0.12),inset 0 0 0 1.5px rgba(11,60,93,0.28) !important;\n}\n.cta-2:hover{\n  background:linear-gradient(180deg,#F4F8FC 0%,#E3ECF4 100%) !important;\n  color:#072B42 !important;transform:translateY(-1px);\n  box-shadow:0 6px 14px rgba(4,40,64,0.14) !important;\n}\n.tel{font-weight:700;letter-spacing:0.01em}\nhtml.contrasto .tel{background:#FFD100 !important;color:#000 !important;border:none !important;box-shadow:inset 0 0 0 2.5px #000 !important}\nhtml.contrasto .cta{background:#8A2600 !important;color:#fff !important;border:none !important;box-shadow:none !important}\nhtml.contrasto .cta-2{background:#fff !important;color:#000 !important;border:none !important;box-shadow:inset 0 0 0 2.5px #000 !important}\n\n/* ============ Scelta dello screening su una riga sola ============ */\n/* La headline sta su una riga sola; l'elenco degli screening resta a griglia leggibile. */\n.scelta-h2{max-width:none;white-space:nowrap}\n@media (max-width:699px){.scelta-h2{white-space:normal}}\n\n/* ============ Schede: piu respiro, informazioni in tondo ============ */\n.card{padding:28px}\n.card .fx.col.gap8{gap:0}\n.dato{padding-top:14px;padding-bottom:14px;gap:6px 14px}\n.dato:first-of-type{padding-top:4px}\n.dato .et{font-weight:400;letter-spacing:0.07em;color:#46534D}\n.dato .vl{font-weight:400}\n.card > h3{margin-top:12px;margin-bottom:4px}\n.card .tel{margin-top:14px}\n.card .nota{margin-top:4px}\n@media (max-width:699px){\n  .card{padding:22px}\n  .dato{padding-top:12px;padding-bottom:12px}\n}\n\n/* Cambio regione dentro l'apertura: discreto, non compete con gli inviti. */\n.sel-discreto{max-width:24rem;align-self:flex-start;margin-top:2px}\n.sel-discreto .campo-sel{\n  background:rgba(6,32,26,0.62);color:#fff;border:1.5px solid rgba(255,255,255,0.4);\n  font-size:17px;font-weight:500;min-height:50px;backdrop-filter:blur(3px)}\n.sel-discreto .campo-sel:hover{border-color:rgba(255,255,255,0.7);background:rgba(6,32,26,0.74)}\n.sel-discreto .campo-sel option{background:#fff;color:var(--inchiostro)}\n.sel-discreto .sel-frecciona{color:rgba(255,255,255,0.85)}\nhtml.contrasto .sel-discreto .campo-sel{background:#00291F;border-color:#fff;backdrop-filter:none}\n@media (max-width:699px){.sel-discreto{max-width:none;align-self:stretch}}\n\n/* ============ Piede completo ============ */\n.ftr-alto{display:grid;grid-template-columns:1fr;gap:32px}\n@media (min-width:700px){.ftr-alto{grid-template-columns:1.4fr 1fr 1fr;gap:36px 28px}}\n@media (min-width:1000px){.ftr-alto{grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px 32px}}\n.ftr .nome{font-size:23px;font-weight:700;letter-spacing:-0.012em}\n.ftr-claim{font-size:17px !important;line-height:1.55;color:#C9DED5 !important;max-width:34ch}\n.ftr-wa{display:inline-flex;align-items:center;gap:10px;min-height:48px;align-self:flex-start;\n  font-size:17px;font-weight:700;color:#8FD3B9 !important;text-decoration:none}\n.ftr-wa svg{width:22px;height:22px;flex-shrink:0}\n.ftr-wa:hover{color:#fff !important;text-decoration:underline;text-underline-offset:4px}\n.ftr-col{display:flex;flex-direction:column}\n.ftr-tit{font-size:15px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;\n  color:#8FD3B9;margin:0 0 6px}\n.ftr-col a{display:inline-flex;align-items:center;min-height:40px;font-size:17px;\n  color:#DCEBE3 !important;text-decoration:none;align-self:flex-start}\n.ftr-col a:hover{color:#fff !important;text-decoration:underline;text-underline-offset:4px}\n.ftr-avviso{display:flex;gap:12px;align-items:flex-start;margin-top:36px;padding:18px 20px;\n  border-radius:12px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.18)}\n.ftr-avviso svg{flex-shrink:0;color:#F0C24E;margin-top:2px}\n.ftr-avviso p{font-size:16px !important;line-height:1.55;color:#D6E7DE !important;max-width:88ch}\n.ftr-basso{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;\n  gap:8px 24px;margin-top:26px;padding-top:20px;border-top:1.5px solid rgba(255,255,255,0.16)}\n.ftr-legale{font-size:15px !important;line-height:1.5;color:#A9C3B9 !important;margin:0;max-width:none}\n.ftr-legale-link{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}\n.ftr-legale a{color:#C9DED5 !important;min-height:40px;padding:0 4px;display:inline-flex;align-items:center}\n.ftr-legale a:hover{color:#fff !important}\n.ftr-legale span{color:rgba(255,255,255,0.35)}\nhtml.contrasto .ftr-tit,html.contrasto .ftr-wa{color:#fff !important}\nhtml.contrasto .ftr-claim,html.contrasto .ftr-legale,html.contrasto .ftr-avviso p{color:#fff !important}\nhtml.contrasto .ftr-avviso{background:transparent;border-color:#fff}\nhtml.contrasto .ftr-avviso svg{color:#fff}\n@media (max-width:699px){\n  .ftr{padding-top:36px}\n  .ftr-avviso{margin-top:28px;padding:16px}\n  .ftr-basso{flex-direction:column;align-items:flex-start;gap:4px}\n}\n\n/* La card della domanda e interamente cliccabile. */\n.art{position:relative}\n.art-tit a::after{content:\"\";position:absolute;inset:0;border-radius:14px}\n.art-vai{position:relative;z-index:1;pointer-events:none}\n.art-img{position:relative;z-index:0;pointer-events:none}\n\n/* ============ Apertura in home: due colonne solo da desktop ============ */\n.hero-due{display:flex;flex-direction:column;gap:28px}\n@media (min-width:1000px){\n  /* Solo l'apertura della home allarga la colonna: il resto del sito\n     resta sulla misura di lettura da 680px. */\n  /* L'apertura della home e larga il doppio della colonna di lettura:\n     serve alla mappa per essere grande. */\n  .hero:has(.hero-due){max-width:1400px}\n  .hero-due{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}\n  .hero-due > .fx{min-width:0}\n}\n\n/* La mappa bianca dell'apertura: sagoma chiara sul velo scuro. */\n.hero-mappa{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}\n.hero-mappa-et{font-size:15px !important;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;\n  color:#A9E2CD !important;text-align:center;max-width:none !important}\n.mappa-bianca{max-width:340px}\n@media (min-width:1000px){.mappa-bianca{max-width:none;width:80%;margin:0 auto}}\n.mappa-bianca svg{filter:drop-shadow(0 6px 18px rgba(0,0,0,0.45))}\n.mappa-bianca path.vuota{fill:rgba(255,255,255,0.34);stroke:#0F6B52;stroke-width:1.3}\n.mappa-bianca path.piena{fill:#FFFFFF;stroke:#0F6B52;stroke-width:1.3}\n.mappa-bianca path.vuota:hover,.mappa-bianca path.vuota:focus{fill:rgba(255,255,255,0.6);stroke:#0A4739;stroke-width:2.4}\n.mappa-bianca path.piena:hover,.mappa-bianca path.piena:focus{fill:#FFD34F;stroke:#0A4739;stroke-width:2.4}\n.mappa-bianca path:focus{stroke:#FFD34F;stroke-width:2.6}\nhtml.contrasto .mappa-bianca path.vuota{fill:#fff;stroke:#000;stroke-width:1.5}\nhtml.contrasto .mappa-bianca path.piena{fill:#FFD100;stroke:#000;stroke-width:1.8}\n.mappa-bianca path.attiva{fill:#FFD34F;stroke:#0A4739}\n@media (max-width:999px){.hero-mappa{display:none}}\n\n/* Domande frequenti: tre per riga, senza tratteggio intorno alle foto */\n@media (min-width:640px){.art-griglia{grid-template-columns:1fr 1fr;gap:20px}}\n@media (min-width:1000px){.art-griglia{grid-template-columns:repeat(3,1fr);gap:22px}}\n.art-img image-slot,.art-img image-slot::part(placeholder),.art-figura-img image-slot{\n  border:0 !important;outline:0 !important;background:#E9EFF4}\n.art-img{background:#E9EFF4}\n\n/* Il numero da chiamare resta un pulsante anche da centrato. */\n.card .tel,.avviso .tel{padding:0 28px;min-width:220px}\n@media (max-width:699px){\n  .card .tel,.avviso .tel{align-self:stretch;width:100%;min-width:0;padding:0 18px}\n}\n\n/* Apertura: respiro ridotto ancora */\n.hero{padding-top:48px;padding-bottom:48px}\n@media (min-width:860px){.hero{padding-top:66px;padding-bottom:66px}}\n@media (max-width:699px){.hero{padding-top:32px;padding-bottom:32px}}\n\n/* Le card delle domande hanno bisogno di larghezza: la fascia che le contiene\n   allarga la colonna solo da desktop. */\n@media (min-width:1000px){\n  .banda:has(.art-griglia){max-width:1120px}\n  .art-griglia{gap:26px}\n  /* Dentro la fascia allargata, ricerca e filtri restano leggibili. */\n  .banda:has(.art-griglia) .cerca,\n  .banda:has(.art-griglia) > .fx > .fx.col.gap8{max-width:680px}\n}\n\n/* Loghi dei sostenitori: piu aria fra un marchio e l'altro */\n.trust-riga{gap:clamp(14px,4.5vw,64px)}\n@media (min-width:1000px){\n  .banda:has(.trust-riga){max-width:1120px}\n  .trust-riga{gap:64px}\n}\n@media (max-width:699px){.trust-riga{gap:22px 34px}}\n<\u002Fstyle>\n        <script src=\"02051590-79cf-42ca-ab8c-63797a6d3a6f\"><\u002Fscript>\n        <script src=\"ca2adcc4-93d6-4676-b4ef-5740c500ddf2\"><\u002Fscript>\n        <script src=\"3746ca17-96ea-4c02-987b-cc1f6b6b8f11\"><\u002Fscript>\n        <script src=\"14e09f4e-8e7c-4061-9156-41b636b42eed\"><\u002Fscript>\n        <script src=\"72e42dc6-6768-4cec-8822-bd681093a190\"><\u002Fscript>\n      <\u002Fhelmet>\n\n      \n\n      <div data-screen-label=\"Portale\">\n\n        <div class=\"hdr\">\n          <div class=\"wrap hdr-riga\">\n            <a class=\"marchio\" href=\"#/\" title=\"Torna alla home\" aria-label=\"Screening Italia, torna alla home\">\n              <span>Screening Italia<\u002Fspan>\n            <\u002Fa>\n            <input class=\"menu-chk\" type=\"checkbox\" id=\"menu-chk\" aria-label=\"Apri il menu\">\n            <label class=\"hamb\" for=\"menu-chk\">\n              <svg class=\"i-apri\" sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\u002Fpath><\u002Fsvg>\n              <svg class=\"i-chiudi\" sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg>\n            <\u002Flabel>\n            <nav class=\"nav-riga\" aria-label=\"Sezioni del sito\">\n              <a href=\"{{ hrefIniziative }}\" aria-current=\"{{ navReg }}\">Iniziative per regione<\u002Fa>\n              <a href=\"#/testimonianze\" aria-current=\"{{ navTesti }}\">Testimonianze<\u002Fa>\n              <a href=\"#/chi\" aria-current=\"{{ navChi }}\">Chi siamo<\u002Fa>\n              <a href=\"#/contatti\" aria-current=\"{{ navContatti }}\">Contatti<\u002Fa>\n              <a href=\"#/faq\" aria-current=\"{{ navFaq }}\">Domande frequenti<\u002Fa>\n            <\u002Fnav>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ vistaHome }}\" hint-placeholder-val=\"{{ true }}\">\n          <div data-screen-label=\"Home\">\n\n            <div class=\"banda hero wrap sezione\" data-screen-label=\"Above the fold\">\n              <div class=\"hero-sfondo\" aria-hidden=\"true\">\n                <image-slot id=\"hero-1\" src=\"https://img.magnific.com/free-photo/smiling-senior-doctor-his-female-patient-communicating-appointment-doctor-s-office_637285-4588.jpg\" shape=\"rect\" placeholder=\"Foto di sezione\"><\u002Fimage-slot>\n                <span class=\"hero-velo\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"hero-due\">\n                <div class=\"fx col gap16\">\n                  <div class=\"occhiello\">Prevenzione oncologica<\u002Fdiv>\n                  <h1>La diagnosi precoce salva la vita. Qui trovi gli screening attivi vicino a te.<\u002Fh1>\n                  <p>Il portale raccoglie i programmi di screening oncologico aperti in Italia, regione per regione, promossi da aziende sanitarie, ospedali e associazioni.<\u002Fp>\n                  <button type=\"button\" class=\"cta\" sc-camel-on-click=\"{{ vaiAllaMappa }}\">Consulta le iniziative attive<\u002Fbutton>\n                  <div class=\"numeri-hero\">\n                    <div class=\"numero-h\"><span class=\"numero-hn\">{{ nIniziative }}<\u002Fspan><span class=\"numero-het\">iniziative aperte<\u002Fspan><\u002Fdiv>\n                    <div class=\"numero-h\"><span class=\"numero-hn\">{{ nRegioni }}<\u002Fspan><span class=\"numero-het\">regioni coperte<\u002Fspan><\u002Fdiv>\n                    <div class=\"numero-h\"><span class=\"numero-hn\">{{ nTipi }}<\u002Fspan><span class=\"numero-het\">tipi di screening<\u002Fspan><\u002Fdiv>\n                    <div class=\"numero-h\"><span class=\"numero-hn\">{{ aggiornato }}<\u002Fspan><span class=\"numero-het\">ultimo aggiornamento<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"hero-mappa\">\n                  <div class=\"mappa mappa-bianca\" ref=\"{{ mappaRef }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n\n            <div class=\"banda b-pieno wrap sezione-bassa\" data-screen-label=\"Sostenitori\">\n              <div class=\"fx col gap16\">\n                <p class=\"trust-occhiello\">Sostengono Screening Italia<\u002Fp>\n                <div class=\"trust-riga\">\n                  <span class=\"trust-logo\">\n                    <svg class=\"trust-marchio\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"16\" r=\"11.5\"><\u002Fcircle><path d=\"M16 4.5v23M4.5 16h23M8 8l16 16M24 8L8 24\"><\u002Fpath><\u002Fsvg>\n                    <span class=\"trust-nome\">Rete Prevenzione<br>Insieme<\u002Fspan>\n                  <\u002Fspan>\n                  <span class=\"trust-logo\">\n                    <svg class=\"trust-marchio\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 28.5s11-7 11-15.5A7.5 7.5 0 0016 8.5 7.5 7.5 0 005 13c0 8.5 11 15.5 11 15.5z\"><\u002Fpath><path d=\"M10 15h4l2-4 2 8 2-4h4\"><\u002Fpath><\u002Fsvg>\n                    <span class=\"trust-nome\">Fondazione<br>Salute Attiva<\u002Fspan>\n                  <\u002Fspan>\n                  <span class=\"trust-logo\">\n                    <svg class=\"trust-marchio\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 4l11 4.5v8c0 7-4.6 11.4-11 13.5C9.6 27.9 5 23.5 5 16.5v-8z\"><\u002Fpath><path d=\"M11 16.5l3.5 3.5L22 12.5\"><\u002Fpath><\u002Fsvg>\n                    <span class=\"trust-nome\">Associazione Italiana<br>Volontari Prevenzione<\u002Fspan>\n                  <\u002Fspan>\n                  <span class=\"trust-logo\">\n                    <svg class=\"trust-marchio\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11.5\" r=\"4.5\"><\u002Fcircle><circle cx=\"21.5\" cy=\"11.5\" r=\"4.5\"><\u002Fcircle><path d=\"M4 26c0-4.4 3.1-7 7-7s7 2.6 7 7M18.5 19.4c3.5-.5 6.5 2.1 6.5 6.6\"><\u002Fpath><\u002Fsvg>\n                    <span class=\"trust-nome\">Consorzio Medici<br>di Comunità<\u002Fspan>\n                  <\u002Fspan>\n                  <span class=\"trust-logo\">\n                    <svg class=\"trust-marchio\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 26V9.5C6 6.5 8.4 4 11.5 4h9C23.6 4 26 6.5 26 9.5V26\"><\u002Fpath><path d=\"M6 26h20M13 26v-7h6v7M16 8.5v5M13.5 11h5\"><\u002Fpath><\u002Fsvg>\n                    <span class=\"trust-nome\">Lega Prevenzione<br>Territoriale<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <p class=\"trust-nota\">Loghi di esempio: nel prototipo non rappresentano enti reali.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-crema wrap sezione\" data-screen-label=\"Come funziona\">\n              <div class=\"fx col gap20\">\n                <h2>Come si consulta<\u002Fh2>\n                <ol class=\"passi\">\n                  <li class=\"passo\">\n                    <span class=\"num\">1<\u002Fspan>\n                    <span class=\"passo-txt\">\n                      <span class=\"passo-tit\">Scegli la regione<\u002Fspan>\n                      <span class=\"passo-desc\">Sulla mappa o dall’elenco. Vedrai subito dove ci sono iniziative aperte e dove no.<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fli>\n                  <li class=\"passo\">\n                    <span class=\"num\">2<\u002Fspan>\n                    <span class=\"passo-txt\">\n                      <span class=\"passo-tit\">Indica gli screening che ti interessano<\u002Fspan>\n                      <span class=\"passo-desc\">Mammografico, colon-retto, prostata e gli altri. Puoi sceglierne più di uno alla volta.<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fli>\n                  <li class=\"passo\">\n                    <span class=\"num\">3<\u002Fspan>\n                    <span class=\"passo-txt\">\n                      <span class=\"passo-tit\">Verifica come aderire<\u002Fspan>\n                      <span class=\"passo-desc\">Ogni scheda riporta ente, sede, periodo, requisiti di età e il numero da chiamare per prenotare.<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fli>\n                <\u002Fol>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-bianco wrap sezione\" id=\"trova\" data-screen-label=\"Scegli la regione\">\n              <div class=\"fx col gap20\">\n                <h2>Seleziona la tua regione<\u002Fh2>\n                <p class=\"nota\">Seleziona la regione sulla mappa: si aprirà l’elenco delle iniziative attive sul territorio.<\u002Fp>\n                <div class=\"mappa\" ref=\"{{ mappaRef }}\"><\u002Fdiv>\n                <sc-if value=\"{{ erroreMappa }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"avviso fx col gap8\">\n                    <h3>La mappa non risulta disponibile.<\u002Fh3>\n                    <p>Seleziona la regione dall’elenco riportato di seguito.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <details class=\"elenco\">\n                  <summary>\n                    <span>Preferisci selezionare da un elenco?<\u002Fspan>\n                    <svg class=\"frecciona\" sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsummary>\n                  <div class=\"elenco-lista\">\n                    <sc-for list=\"{{ regioni }}\" as=\"r\" hint-placeholder-count=\"8\">\n                      <a href=\"{{ r.href }}\">{{ r.nome }}<\u002Fa>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdetails>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n\n            <div class=\"banda b-verde wrap banda-larga sezione\" data-screen-label=\"Testimonianze\">\n              <div class=\"fx col gap20\">\n                <h2>Chi l’ha usato<\u002Fh2>\n                <div class=\"finto\">Testimonianze di esempio: nel prototipo non sono persone reali.<\u002Fdiv>\n                <div class=\"carosello\">\n                  <div class=\"car-pista\">\n                    <sc-for list=\"{{ testiGiro }}\" as=\"t\" hint-placeholder-count=\"3\">\n                      <figure class=\"testi\">\n                      <div class=\"testi-testa\">\n                        <span class=\"testi-foto\"><image-slot id=\"{{ t.slot }}\" src=\"{{ t.foto }}\" shape=\"circle\" placeholder=\"Foto\"><\u002Fimage-slot><\u002Fspan>\n                        <figcaption class=\"testi-chi\">\n                          <span class=\"testi-nome\">{{ t.nome }}<\u002Fspan>\n                          <span class=\"testi-ruolo\">{{ t.ruolo }}<\u002Fspan>\n                        <\u002Ffigcaption>\n                      <\u002Fdiv>\n                      <blockquote class=\"testi-txt\">{{ t.testo }}<\u002Fblockquote>\n                    <\u002Ffigure>\n                    <\u002Fsc-for>\n                    <sc-for list=\"{{ testiGiro }}\" as=\"t\" hint-placeholder-count=\"3\">\n                      <figure class=\"testi\">\n                      <div class=\"testi-testa\">\n                        <span class=\"testi-foto\"><image-slot id=\"{{ t.slot }}\" src=\"{{ t.foto }}\" shape=\"circle\" placeholder=\"Foto\"><\u002Fimage-slot><\u002Fspan>\n                        <figcaption class=\"testi-chi\">\n                          <span class=\"testi-nome\">{{ t.nome }}<\u002Fspan>\n                          <span class=\"testi-ruolo\">{{ t.ruolo }}<\u002Fspan>\n                        <\u002Ffigcaption>\n                      <\u002Fdiv>\n                      <blockquote class=\"testi-txt\">{{ t.testo }}<\u002Fblockquote>\n                    <\u002Ffigure>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <a class=\"cta-2\" href=\"#/testimonianze\">Leggi tutte le testimonianze<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-crema wrap sezione\" data-screen-label=\"Domande frequenti in home\">\n              <div class=\"fx col gap20\">\n                <h2>Domande frequenti<\u002Fh2>\n                <div class=\"art-griglia\">\n                  <sc-for list=\"{{ faqHome }}\" as=\"a\" hint-placeholder-count=\"3\">\n                    <div class=\"art\">\n                      <div class=\"art-img\"><image-slot id=\"{{ a.slot }}\" src=\"{{ a.foto }}\" shape=\"rect\" placeholder=\"Foto\"><\u002Fimage-slot><\u002Fdiv>\n                      <div class=\"art-corpo\">\n                        <p class=\"art-meta\">{{ a.cat }} · {{ a.data }}<\u002Fp>\n                        <h3 class=\"art-tit\"><a href=\"{{ a.href }}\">{{ a.titolo }}<\u002Fa><\u002Fh3>\n                        <p class=\"art-som\">{{ a.sommario }}<\u002Fp>\n                        <a class=\"art-vai\" href=\"{{ a.href }}\">Leggi la risposta\n                          <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h13M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fa>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <a class=\"cta-2\" href=\"#/faq\">Consulta tutte le domande<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-verde wrap sezione\" data-screen-label=\"Sei un ente\">\n              <div class=\"fx col gap16\">\n                <div class=\"occhiello\">Per chi organizza<\u002Fdiv>\n                <h2>Sei un’ASL, un ospedale, un’associazione?<\u002Fh2>\n                <p style=\"margin-left:auto;margin-right:auto;text-align:center\">Segnalaci la tua iniziativa: controlliamo i dati sulla fonte ufficiale e la pubblichiamo qui, gratuitamente.<\u002Fp>\n                <a class=\"cta\" href=\"#/contatti\">Segnala un’iniziativa<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ vistaRegione }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-screen-label=\"Iniziative della regione\">\n\n            <div class=\"banda hero wrap sezione\" data-screen-label=\"Apertura\">\n              <div class=\"hero-sfondo\" aria-hidden=\"true\">\n                <image-slot id=\"hero-2\" src=\"https://img.magnific.com/free-photo/happy-senior-woman-shaking-hands-with-doctor-while-talking-her-hospital-hallway_637285-5309.jpg\" shape=\"rect\" placeholder=\"Foto di sezione\"><\u002Fimage-slot>\n                <span class=\"hero-velo\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"fx col gap16\">\n                <p class=\"nota\"><a href=\"#/\">← Torna a tutte le regioni<\u002Fa><\u002Fp>\n                <h1>Screening in {{ reg }}<\u002Fh1>\n                <p>{{ apertura }}<\u002Fp>\n                <div class=\"sel-box sel-discreto\">\n                  <sc-raw-select class=\"campo campo-sel\" id=\"cambia-reg-alto\" sc-camel-default-value=\"{{ reg }}\" sc-camel-on-change=\"{{ vaiA }}\" aria-label=\"Cambia regione\">\n                    <sc-for list=\"{{ elencoRegioni }}\" as=\"o\" hint-placeholder-count=\"6\">\n                      <option value=\"{{ o.nome }}\">{{ o.etichetta }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <svg class=\"sel-frecciona\" sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-bianco wrap sezione\" data-screen-label=\"Scelta dello screening\">\n              <div class=\"fx col gap20\">\n                <div class=\"fx col gap8\">\n                  <h2 class=\"scelta-h2\">Quali screening ti interessano?<\u002Fh2>\n                  <p class=\"nota\">Puoi selezionarne più di uno. L’elenco sottostante mostrerà le sole iniziative corrispondenti.<\u002Fp>\n                <\u002Fdiv>\n                <div class=\"scelte\">\n                  <sc-for list=\"{{ scelte }}\" as=\"s\" hint-placeholder-count=\"5\">\n                    <button type=\"button\" class=\"{{ s.cls }}\" sc-camel-on-click=\"{{ s.pick }}\" aria-pressed=\"{{ s.on }}\">\n                      <svg class=\"scelta-icona\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ s.icona }}\"><\u002Fpath><\u002Fsvg>\n                      <span class=\"scelta-txt\">\n                        <span class=\"scelta-nome\">{{ s.nome }}<\u002Fspan>\n                        <span class=\"scelta-n\">{{ s.conta }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <p class=\"nota\" aria-live=\"polite\">{{ quante }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-crema wrap sezione\" data-screen-label=\"Le iniziative\">\n              <div class=\"fx col gap20\">\n                <div class=\"fx col gap8\">\n                  <h2>{{ titoloElenco }}<\u002Fh2>\n                  <p class=\"nota\">Per ciascuna iniziativa sono indicati l’ente organizzatore, la sede, il periodo e il recapito telefonico. In cima quelle che chiudono prima.<\u002Fp>\n                  <sc-if value=\"{{ haAvvisoScadenza }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p class=\"urgenza\">\n                      <svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.6\"><\u002Fcircle><path d=\"M12 7.6V12l3 2\"><\u002Fpath><\u002Fsvg>\n                      {{ avvisoScadenza }}\n                    <\u002Fp>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <sc-for list=\"{{ iniziative }}\" as=\"i\" hint-placeholder-count=\"3\">\n                  <div class=\"card fx col gap14\">\n                    <div class=\"fx gap8\" style=\"flex-wrap:wrap\">\n                      <span class=\"{{ i.tagCls }}\">{{ i.tagTesto }}<\u002Fspan>\n                      <span class=\"tag tag-tipo\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.icona }}\"><\u002Fpath><\u002Fsvg>{{ i.tipo }}<\u002Fspan>\n                      <sc-if value=\"{{ i.haScadenza }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span class=\"{{ i.scadenzaCls }}\">\n                          <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.6\"><\u002Fcircle><path d=\"M12 7.6V12l3 2\"><\u002Fpath><\u002Fsvg>{{ i.scadenza }}\n                        <\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ i.haPosti }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span class=\"scad scad-posti\">{{ i.posti }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <h3>{{ i.titolo }}<\u002Fh3>\n                    <div class=\"fx col gap8\">\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 12.6a4.05 4.05 0 100-8.1 4.05 4.05 0 000 8.1M4.5 20.2c0-3.3 3.4-5.2 7.5-5.2s7.5 1.9 7.5 5.2\"><\u002Fpath><\u002Fsvg>Chi<\u002Fspan><span class=\"vl\">{{ i.ente }}<\u002Fspan><\u002Fdiv>\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s7-5.4 7-11a7 7 0 10-14 0c0 5.6 7 11 7 11zM12 12.4a2.6 2.6 0 100-5.2 2.6 2.6 0 000 5.2\"><\u002Fpath><\u002Fsvg>Dove<\u002Fspan><span class=\"vl\">{{ i.dove }}<\u002Fspan><\u002Fdiv>\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3v3M17 3v3M3.5 9.5h17M4.5 6h15a1 1 0 011 1v12a1 1 0 01-1 1h-15a1 1 0 01-1-1V7a1 1 0 011-1z\"><\u002Fpath><\u002Fsvg>Quando<\u002Fspan><span class=\"vl\">{{ i.quando }}<\u002Fspan><\u002Fdiv>\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21a9 9 0 100-18 9 9 0 000 18M8.5 12.2l2.4 2.4 4.6-5.2\"><\u002Fpath><\u002Fsvg>Chi può<\u002Fspan><span class=\"vl\">{{ i.chi }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                    <a class=\"tel\" href=\"{{ i.href }}\">\n                      <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7.2 3.5H4.9a1.4 1.4 0 00-1.4 1.5c.5 8.2 7.3 15 15.5 15.5a1.4 1.4 0 001.5-1.4v-2.3a1.4 1.4 0 00-1.2-1.4l-2.8-.4a1.4 1.4 0 00-1.4.7l-.8 1.4a11.6 11.6 0 01-5.6-5.6l1.4-.8a1.4 1.4 0 00.7-1.4l-.4-2.8a1.4 1.4 0 00-1.4-1.2z\"><\u002Fpath><\u002Fsvg>\n                      {{ i.tel }}\n                    <\u002Fa>\n                    <p class=\"nota\">La prenotazione avviene telefonicamente al numero indicato. Il portale non gestisce appuntamenti.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n\n                <sc-if value=\"{{ vuotoPerScelta }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"avviso fx col gap12\">\n                    <h3>Nessuna iniziativa attiva per gli screening selezionati.<\u002Fh3>\n                    <p>Prova a ridurre la selezione, oppure consulta tutte le iniziative della regione.<\u002Fp>\n                    <button type=\"button\" class=\"cta-2\" sc-camel-on-click=\"{{ azzera }}\">Mostra tutte le iniziative<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-verde wrap sezione\" data-screen-label=\"Le due porte\">\n              <div class=\"fx col gap16\">\n                <h2>Nessuna iniziativa nelle tue vicinanze?<\u002Fh2>\n                <p>Le iniziative vengono attivate e chiuse con frequenza. Puoi richiedere un avviso alla pubblicazione di una nuova iniziativa in {{ reg }}.<\u002Fp>\n                <a class=\"cta\" href=\"{{ hrefVuota }}\">Richiedi un avviso<\u002Fa>\n                <a class=\"link-cta\" href=\"#/faq\">Come funziona lo screening pubblico\n                  <svg sc-camel-view-box=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h13M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fa>\n                <p class=\"nota\">Organizzi un’iniziativa? <a href=\"#/contatti\">Segnalacela<\u002Fa>: dopo la verifica dei dati sarà pubblicata.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-bianco wrap sezione\" data-screen-label=\"Cambia regione\">\n              <div class=\"fx col gap20\">\n                <h2>Cambia regione<\u002Fh2>\n                <p class=\"nota\">Tocca un’altra regione sulla mappa, oppure scegli dall’elenco.<\u002Fp>\n                <div class=\"mappa\" ref=\"{{ mappaRef }}\"><\u002Fdiv>\n                <div class=\"sel-box\">\n                  <sc-raw-select class=\"campo campo-sel\" id=\"scegli-reg\" sc-camel-default-value=\"{{ reg }}\" sc-camel-on-change=\"{{ vaiA }}\" aria-label=\"Cambia regione\">\n                    <sc-for list=\"{{ elencoRegioni }}\" as=\"o\" hint-placeholder-count=\"6\">\n                      <option value=\"{{ o.nome }}\">{{ o.etichetta }}<\u002Foptio
