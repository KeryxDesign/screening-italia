n>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <svg class=\"sel-frecciona\" sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ vistaVuota }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-screen-label=\"Regione senza iniziative\">\n\n            <div class=\"banda hero wrap sezione\" data-screen-label=\"Non c e niente\">\n              <div class=\"hero-sfondo\" aria-hidden=\"true\">\n                <image-slot id=\"hero-3\" src=\"https://img.magnific.com/free-photo/senior-couple-walking-along-seashore-sunny-day-smiling-man-with-gray-hair-happy-short-haired-woman-coat-spending-time-together-outdoors-relationship-partnership-concept_74855-23397.jpg\" shape=\"rect\" placeholder=\"Foto di sezione\"><\u002Fimage-slot>\n                <span class=\"hero-velo\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"fx col gap16\">\n                <p class=\"nota\"><a href=\"#/\">← Torna a tutte le regioni<\u002Fa><\u002Fp>\n                <h1>In {{ reg }} non risultano iniziative segnalate.<\u002Fh1>\n                <p>Significa che nessuna iniziativa ci è stata segnalata, non che in {{ reg }} manchi l’attività di prevenzione: i programmi di screening dell’azienda sanitaria proseguono comunque. Di seguito le modalità di accesso.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-crema wrap sezione\" data-screen-label=\"Cosa puoi fare comunque\">\n              <div class=\"fx col gap20\">\n                <h2>Il programma pubblico è attivo anche nella tua regione<\u002Fh2>\n                <p>È gratuito e, per legge, deve essere garantito in tutte le regioni. Si articola in tre passaggi:<\u002Fp>\n                <div class=\"fx col gap16\">\n                  <div class=\"passo\"><span class=\"num\">1<\u002Fspan><p>L’azienda sanitaria invia una lettera di invito al domicilio al raggiungimento dell’età prevista. Non occorre farne richiesta.<\u002Fp><\u002Fdiv>\n                  <div class=\"passo\"><span class=\"num\">2<\u002Fspan><p>La lettera contiene un appuntamento già fissato, oppure il recapito telefonico per concordarlo.<\u002Fp><\u002Fdiv>\n                  <div class=\"passo\"><span class=\"num\">3<\u002Fspan><p>L’esame è gratuito e non richiede l’impegnativa del medico di medicina generale.<\u002Fp><\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"avviso fx col gap12\">\n                  <h3>La lettera di invito non è pervenuta?<\u002Fh3>\n                  <p>Accade di frequente: cambio di domicilio, residenza non aggiornata, mancato recapito postale. La tua posizione è recuperabile e non perdi il turno.<\u002Fp>\n                  <a class=\"cta-2\" href=\"#/faq\">Come procedere in caso di mancato recapito<\u002Fa>\n                <\u002Fdiv>\n                <a class=\"cta-2\" href=\"#/faq\">Il portale screening della Regione {{ reg }}<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-verde wrap sezione\" data-screen-label=\"Avvisami\">\n              <div class=\"fx col gap16\">\n                <h2>Servizio di avviso<\u002Fh2>\n                <p>Indicando un indirizzo email riceverai una comunicazione alla pubblicazione di una nuova iniziativa in {{ reg }}. Nessun altro invio.<\u002Fp>\n                <sc-if value=\"{{ inviato }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"fatto\">Richiesta registrata. Ti scriviamo alla prima iniziativa pubblicata in {{ reg }}.<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ daCompilare }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div class=\"fx col gap16\">\n                    <div>\n                      <label class=\"etichetta\" for=\"mail\">La tua email<\u002Flabel>\n                      <input class=\"campo\" id=\"mail\" type=\"email\" placeholder=\"nome@esempio.it\" value=\"{{ mail }}\" sc-camel-on-input=\"{{ scriviMail }}\">\n                    <\u002Fdiv>\n                    <button type=\"button\" class=\"cta\" sc-camel-on-click=\"{{ inviaMail }}\">Attiva l’avviso<\u002Fbutton>\n                    <p class=\"nota\">Non ti chiediamo né registriamo alcun dato sanitario. Le comunicazioni riguardano solo questa regione.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-bianco wrap sezione\" data-screen-label=\"Pubblica un iniziativa\">\n              <div class=\"fx col gap16\">\n                <h2>Enti e associazioni<\u002Fh2>\n                <p>Aziende sanitarie, ospedali, ambulatori e associazioni possono segnalare le proprie iniziative: dopo la verifica dei dati vengono pubblicate su questo portale.<\u002Fp>\n                <a class=\"cta-2\" href=\"#/contatti\">Segnala un’iniziativa<\u002Fa>\n                <p class=\"nota\">Il servizio è gratuito ed è riservato agli enti organizzatori.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ vistaFaq }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-screen-label=\"Domande frequenti\">\n\n            <div class=\"banda hero wrap sezione\" data-screen-label=\"Apertura domande\">\n              <div class=\"hero-sfondo\" aria-hidden=\"true\">\n                <image-slot id=\"hero-4\" src=\"https://img.magnific.com/free-photo/male-doctor-using-touchpad-explaining-medical-test-results-his-senior-patient-medical-appointment_637285-1471.jpg\" shape=\"rect\" placeholder=\"Foto di sezione\"><\u002Fimage-slot>\n                <span class=\"hero-velo\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"fx col gap16\">\n                <div class=\"occhiello\">Domande frequenti<\u002Fdiv>\n                <h1>Le domande più frequenti<\u002Fh1>\n                <p>Risposte sintetiche e verificate sul funzionamento dei programmi di screening pubblici e sui passaggi da seguire quando qualcosa non ti è chiaro.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-crema wrap sezione\" data-screen-label=\"Cerca e filtra\">\n              <div class=\"fx col gap16\">\n                <div class=\"cerca\">\n                  <svg class=\"cerca-i\" sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-4-4\"><\u002Fpath><\u002Fsvg>\n                  <label class=\"sr\" for=\"cerca\">Cerca una domanda<\u002Flabel>\n                  <input class=\"campo campo-cerca\" id=\"cerca\" type=\"search\" placeholder=\"Cerca per parola: invito, kit, età, prenotazione…\" value=\"{{ q }}\" sc-camel-on-input=\"{{ scrivi }}\">\n                  <sc-if value=\"{{ haQ }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" class=\"cerca-x\" sc-camel-on-click=\"{{ pulisci }}\" aria-label=\"Cancella la ricerca\">\n                      <svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div class=\"fx col gap8\">\n                  <p class=\"nota\">Filtra per argomento<\u002Fp>\n                  <div class=\"fx gap8\" style=\"flex-wrap:wrap\">\n                    <sc-for list=\"{{ categorie }}\" as=\"c\" hint-placeholder-count=\"4\">\n                      <button type=\"button\" class=\"{{ c.cls }}\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.nome }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <p class=\"nota\" aria-live=\"polite\">{{ quanteFaq }}<\u002Fp>\n\n                <div class=\"art-griglia\">\n                  <sc-for list=\"{{ risposte }}\" as=\"a\" hint-placeholder-count=\"4\">\n                    <div class=\"art\">\n                      <div class=\"art-img\"><image-slot id=\"{{ a.slot }}\" src=\"{{ a.foto }}\" shape=\"rect\" placeholder=\"Foto\"><\u002Fimage-slot><\u002Fdiv>\n                      <div class=\"art-corpo\">\n                        <p class=\"art-meta\">{{ a.cat }} · {{ a.data }}<\u002Fp>\n                        <h3 class=\"art-tit\"><a href=\"{{ a.href }}\">{{ a.titolo }}<\u002Fa><\u002Fh3>\n                        <p class=\"art-som\">{{ a.sommario }}<\u002Fp>\n                        <a class=\"art-vai\" href=\"{{ a.href }}\">Leggi la risposta\n                          <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h13M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fa>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ vuotoFaq }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"avviso fx col gap12\">\n                    <h3>Nessuna risposta per «{{ q }}».<\u002Fh3>\n                    <p>Prova con un solo termine, oppure scrivici: se la domanda è di interesse generale la inseriamo.<\u002Fp>\n                    <a class=\"cta-2\" href=\"#/contatti\">Invia la tua domanda<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-bianco wrap sezione\" data-screen-label=\"Rimando alla mappa\">\n              <div class=\"fx col gap16\">\n                <h2>Cerchi un esame, non una risposta?<\u002Fh2>\n                <p>Sulla mappa sono riportate le iniziative attualmente attive, regione per regione.<\u002Fp>\n                <a class=\"cta\" href=\"#/\">Vai alla mappa delle regioni<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ vistaProstata }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-screen-label=\"Articolo prostata\">\n\n            <div class=\"banda hero wrap sezione\" data-screen-label=\"Apertura articolo\">\n              <div class=\"hero-sfondo\" aria-hidden=\"true\">\n                <image-slot id=\"hero-5\" src=\"https://img.magnific.com/free-photo/mature-man-talking-african-american-doctor-home-visit_637285-11352.jpg\" shape=\"rect\" placeholder=\"Foto di sezione\"><\u002Fimage-slot>\n                <span class=\"hero-velo\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"fx col gap16\">\n                <p class=\"nota\"><a href=\"#/faq\">← Torna alle domande frequenti<\u002Fa><\u002Fp>\n                <div class=\"occhiello\">Screening della prostata<\u002Fdiv>\n                <h1>Per la prostata non è previsto invito: che cosa comporta<\u002Fh1>\n                <p>In Italia i programmi di screening organizzati riguardano tre tumori: mammella, colon-retto e cervice uterina. La prostata non rientra fra questi: non ricevi alcuna convocazione, e il primo passo del controllo spetta a te.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-verde wrap sezione\" data-screen-label=\"Le domande sulla prostata\">\n              <div class=\"fx col gap24\">\n                <div class=\"fx col gap12\">\n                  <h2>Da quale età è indicato il controllo<\u002Fh2>\n                  <p>Il primo controllo si colloca abitualmente intorno ai 50 anni. Se hai familiarità di primo grado, è opportuno anticipare il confronto con il medico verso i 45 anni.<\u002Fp>\n                <\u002Fdiv>\n                <div class=\"fx col gap12\">\n                  <h2>In che cosa consiste l’esame<\u002Fh2>\n                  <p>Si tratta di un prelievo di sangue per il dosaggio del PSA. Richiede pochi minuti e non è doloroso. Il valore, da solo, non indica la presenza di un tumore: segnala l’opportunità di ulteriori accertamenti.<\u002Fp>\n                <\u002Fdiv>\n                <div class=\"fx col gap12\">\n                  <h2>Chi prescrive l’esame<\u002Fh2>\n                  <p>Il medico di medicina generale. Per il primo esame non serve la visita specialistica: in presenza di valori alterati sarà lui a indirizzarti dall’urologo.<\u002Fp>\n                <\u002Fdiv>\n                <div class=\"fx col gap12\">\n                  <h2>È previsto un costo<\u002Fh2>\n                  <p>Con l’impegnativa del medico è dovuto il ticket. Nelle giornate organizzate da ospedali e associazioni l’esame è spesso gratuito: le iniziative attive sono riportate di seguito.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-bianco wrap sezione\" data-screen-label=\"Dove si fa adesso\">\n              <div class=\"fx col gap20\">\n                <h2>Dove è possibile effettuarlo<\u002Fh2>\n                <div class=\"finto\">Dati dimostrativi. Le iniziative riportate non sono reali: servono a verificare il funzionamento della pagina.<\u002Fdiv>\n\n                <sc-for list=\"{{ prostata }}\" as=\"i\" hint-placeholder-count=\"2\">\n                  <div class=\"card fx col gap14\">\n                    <div class=\"fx gap8\" style=\"flex-wrap:wrap\">\n                      <span class=\"{{ i.tagCls }}\">{{ i.tagTesto }}<\u002Fspan>\n                      <sc-if value=\"{{ i.haScadenza }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span class=\"{{ i.scadenzaCls }}\">\n                          <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.6\"><\u002Fcircle><path d=\"M12 7.6V12l3 2\"><\u002Fpath><\u002Fsvg>{{ i.scadenza }}\n                        <\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <h3>{{ i.titolo }}<\u002Fh3>\n                    <div class=\"fx col gap8\">\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 12.6a4.05 4.05 0 100-8.1 4.05 4.05 0 000 8.1M4.5 20.2c0-3.3 3.4-5.2 7.5-5.2s7.5 1.9 7.5 5.2\"><\u002Fpath><\u002Fsvg>Chi<\u002Fspan><span class=\"vl\">{{ i.ente }}<\u002Fspan><\u002Fdiv>\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s7-5.4 7-11a7 7 0 10-14 0c0 5.6 7 11 7 11zM12 12.4a2.6 2.6 0 100-5.2 2.6 2.6 0 000 5.2\"><\u002Fpath><\u002Fsvg>Dove<\u002Fspan><span class=\"vl\">{{ i.dove }}<\u002Fspan><\u002Fdiv>\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3v3M17 3v3M3.5 9.5h17M4.5 6h15a1 1 0 011 1v12a1 1 0 01-1 1h-15a1 1 0 01-1-1V7a1 1 0 011-1z\"><\u002Fpath><\u002Fsvg>Quando<\u002Fspan><span class=\"vl\">{{ i.quando }}<\u002Fspan><\u002Fdiv>\n                      <div class=\"dato\"><span class=\"et\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21a9 9 0 100-18 9 9 0 000 18M8.5 12.2l2.4 2.4 4.6-5.2\"><\u002Fpath><\u002Fsvg>Chi può<\u002Fspan><span class=\"vl\">{{ i.chi }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                    <a class=\"tel\" href=\"{{ i.href }}\">\n                      <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7.2 3.5H4.9a1.4 1.4 0 00-1.4 1.5c.5 8.2 7.3 15 15.5 15.5a1.4 1.4 0 001.5-1.4v-2.3a1.4 1.4 0 00-1.2-1.4l-2.8-.4a1.4 1.4 0 00-1.4.7l-.8 1.4a11.6 11.6 0 01-5.6-5.6l1.4-.8a1.4 1.4 0 00.7-1.4l-.4-2.8a1.4 1.4 0 00-1.4-1.2z\"><\u002Fpath><\u002Fsvg>\n                      {{ i.tel }}\n                    <\u002Fa>\n                    <p class=\"nota\">La prenotazione avviene telefonicamente al numero indicato. Il portale non gestisce appuntamenti.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n\n                <div class=\"avviso fx col gap12\">\n                  <h3>Nessuna iniziativa nella tua regione?<\u002Fh3>\n                  <p>Le giornate vengono attivate e chiuse con frequenza. Consulta la tua regione oppure attiva il servizio di avviso.<\u002Fp>\n                  <a class=\"cta-2\" href=\"#/\">Consulta la tua regione<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ vistaChi }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-screen-label=\"Chi siamo\">\n\n            <div class=\"banda hero wrap sezione\" data-screen-label=\"Chi siamo apertura\">\n              <div class=\"hero-sfondo\" aria-hidden=\"true\">\n                <image-slot id=\"hero-6\" src=\"https://img.magnific.com/free-photo/happy-senior-couple-communicating-with-doctor-about-their-health-insurance-while-going-through-paperwork_637285-1194.jpg\" shape=\"rect\" placeholder=\"Foto di sezione\"><\u002Fimage-slot>\n                <span class=\"hero-velo\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"fx col gap16\">\n                <div class=\"occhiello\">Chi siamo<\u002Fdiv>\n                <h1>Un elenco curato e verificato, non un algoritmo<\u002Fh1>\n                <p>Siamo un gruppo di volontari. Con cadenza settimanale consultiamo i siti delle aziende sanitarie, degli ospedali e delle associazioni e riportiamo qui le iniziative attive, complete di periodo e recapito.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-crema wrap sezione\" data-screen-label=\"Come lavoriamo\">\n              <div class=\"fx col gap20\">\n                <h2>Il procedimento di verifica<\u002Fh2>\n                <div class=\"fx col gap14\">\n                  <div class=\"card fx col gap8\">\n                    <h3>1. Ricezione della segnalazione<\u002Fh3>\n                    <p>Dall’ente organizzatore o da chi ne è venuto a conoscenza.<\u002Fp>\n                  <\u002Fdiv>\n                  <div class=\"card fx col gap8\">\n                    <h3>2. Riscontro sulla fonte ufficiale<\u002Fh3>\n                    <p>Il sito dell’azienda sanitaria, dell’ospedale o dell’associazione. In assenza di riscontro contattiamo il numero indicato.<\u002Fp>\n                  <\u002Fdiv>\n                  <div class=\"card fx col gap8\">\n                    <h3>3. Pubblicazione, con la data<\u002Fh3>\n                    <p>Le informazioni non verificate non vengono pubblicate. Alla chiusura dell’iniziativa la scheda viene rimossa.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-verde wrap sezione\" data-screen-label=\"Cosa non facciamo\">\n              <div class=\"fx col gap16\">\n                <h2>Ambito del servizio<\u002Fh2>\n                <p>Non gestiamo prenotazioni, non vendiamo prestazioni, non raccogliamo dati sanitari e non diamo pareri clinici: per quelli la competenza è del tuo medico di medicina generale.<\u002Fp>\n                <a class=\"cta-2\" href=\"#/contatti\">Contatti<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ vistaContatti }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-screen-label=\"Contatti\">\n\n            <div class=\"banda hero wrap sezione\" data-screen-label=\"Contatti apertura\">\n              <div class=\"hero-sfondo\" aria-hidden=\"true\">\n                <image-slot id=\"hero-7\" src=\"https://img.magnific.com/free-photo/happy-doctor-informing-senior-patient-about-health-insurance-options-consultations-clinic_637285-1891.jpg\" shape=\"rect\" placeholder=\"Foto di sezione\"><\u002Fimage-slot>\n                <span class=\"hero-velo\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"fx col gap16\">\n                <div class=\"occhiello\">Contatti<\u002Fdiv>\n                <h1>Contatti<\u002Fh1>\n                <p>Hai visto un’iniziativa non presente o un dato inesatto? Segnalacelo: provvediamo alla correzione entro pochi giorni.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"banda b-bianco wrap sezione\" data-screen-label=\"Recapiti\">\n              <div class=\"fx col gap20\">\n                <h2>Scrivici ora su WhatsApp<\u002Fh2>\n                <a class=\"wa\" href=\"https://wa.me/393000000000\" target=\"_blank\" rel=\"noopener\">\n                  <svg class=\"wa-i\" sc-camel-view-box=\"0 0 32 32\" fill=\"cur ref=\"#/chi\">Accessibilità<\u002Fa>\n              <\u002Fp>\n              <p class=\"ftr-legale\">Dati dimostrativi aggiornati al {{ aggiornato }}<\u002Fp>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { rotta: this.leggiRotta(), tipi: [], q: \"\", cat: null, mail: \"\", inviato: false };\n    this.mappaRef = (el) => { this.mapEl = el; this.disegnaMappa(); };\n  }\n  componentDidMount() {\n    this.onHash = () => {\n      this.setState({ rotta: this.leggiRotta(), tipi: [], inviato: false, mail: \"\" });\n      window.scrollTo(0, 0);\n    };\n    window.addEventListener(\"hashchange\", this.onHash);\n    // In certe anteprime in iframe il cambio di indirizzo e bloccato:\n    // i clic sui link interni vengono gestiti qui, senza dipendere dall hash.\n    this.onClickInterno = (e) => {\n      const a = e.target && e.target.closest ? e.target.closest('a[href^=\"#/\"]') : null;\n      if (!a) { return; }\n      e.preventDefault();\n      this.vaiA(a.getAttribute(\"href\"));\n    };\n    document.addEventListener(\"click\", this.onClickInterno);\n    this.tick = setInterval(() => {\n      const vuote = document.querySelectorAll(\".mappa:not(:has(svg))\");\n      if (vuote.length) { this.disegnaMappa(); }\n      if (!window.INIZIATIVE || !window.REGIONI_ITALIA) { this.forceUpdate(); } else if (!this.datiPronti) { this.datiPronti = true; this.forceUpdate(); }\n    }, 350);\n    setTimeout(() => { if (!window.REGIONI_ITALIA) { this.setState({ erroreMappa: true }); } }, 8000);\n    this.centraNav();\n    document.documentElement.classList.add(\"js-anim\");\n    this.osserva();\n  }\n  osserva() {\n    // Comparsa graduale dei blocchi quando entrano nello schermo.\n    const applica = () => {\n      // Solo i blocchi strutturali: mai le schede generate dai filtri,\n      // altrimenti un contenuto rigenerato potrebbe restare invisibile.\n      const nodi = document.querySelectorAll(\".banda > div > *\");\n      nodi.forEach((n, i) => {\n        if (n.closest(\".hero\")) { return; }\n        if (n.classList.contains(\"card\") || n.classList.contains(\"art\")) { return; }\n        if (n.classList.contains(\"rivela\")) { return; }\n        n.classList.add(\"rivela\");\n        if (i % 3 === 1) { n.classList.add(\"d1\"); }\n        if (i % 3 === 2) { n.classList.add(\"d2\"); }\n        // Se e gia in vista (o quasi) si mostra subito: la visibilita non dipende dall osservatore.\n        const b = n.getBoundingClientRect();\n        if (b.top < window.innerHeight * 1.05) {\n          requestAnimationFrame(() => n.classList.add(\"dentro\"));\n          return;\n        }\n        if (this.occhio) { this.occhio.observe(n); } else { n.classList.add(\"dentro\"); }\n      });\n    };\n    if (!this.occhio && window.IntersectionObserver) {\n      this.occhio = new IntersectionObserver((voci) => {\n        voci.forEach((v) => {\n          if (v.isIntersecting) { v.target.classList.add(\"dentro\"); this.occhio.unobserve(v.target); }\n        });\n      }, { rootMargin: \"0px 0px -8% 0px\", threshold: 0.05 });\n    }\n    applica();\n    this.riapplica = applica;\n    setTimeout(applica, 400);\n    this.rete();\n    // Anche durante lo scorrimento: cio che entra in vista si mostra, sempre.\n    this.onScroll = () => {\n      document.querySelectorAll(\".rivela:not(.dentro)\").forEach((n) => {\n        const b = n.getBoundingClientRect();\n        if (b.top < window.innerHeight * 0.94 && b.bottom > 0) { n.classList.add(\"dentro\"); }\n      });\n    };\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n    window.addEventListener(\"resize\", this.onScroll);\n  }\n  rete() {\n    // Nulla resta invisibile: dopo poco si mostra tutto cio che e in vista.\n    clearTimeout(this.reteTimer);\n    this.reteTimer = setTimeout(() => {\n      document.querySelectorAll(\".rivela:not(.dentro)\").forEach((n) => {\n        const b = n.getBoundingClientRect();\n        if (b.top < window.innerHeight * 1.3) { n.classList.add(\"dentro\"); }\n      });\n    }, 1200);\n  }\n  componentDidUpdate() {\n    if (this.riapplica) { this.riapplica(); this.rete(); }\n    this.disegnaMappa();\n    const s = document.querySelector(\"#scegli-reg\");\n    if (s && s.options.length > 1 && s.value !== this.reg()) { s.value = this.reg(); }\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"hashchange\", this.onHash);\n    document.removeEventListener(\"click\", this.onClickInterno);\n    window.removeEventListener(\"scroll\", this.onScroll);\n    window.removeEventListener(\"resize\", this.onScroll);\n    clearInterval(this.tick);\n  }\n  centraNav() {\n    setTimeout(() => {\n      const nav = document.querySelector(\".nav-riga\");\n      const att = nav && nav.querySelector('[aria-current=\"page\"]');\n      if (nav && att) { nav.scrollLeft = att.offsetLeft - (nav.clientWidth - att.offsetWidth) / 2; }\n    }, 150);\n  }\n\n  vaiA(rotta) {\n    const pulita = String(rotta).replace(/^#\\/?/, \"\");\n    const p = pulita.split(\"/\");\n    let vista = p[0] || \"\";\n    const note = [\"\", \"regione\", \"vuota\", \"faq\", \"prostata\", \"chi\", \"contatti\", \"testimonianze\", \"articolo\"];\n    if (note.indexOf(vista) === -1) { vista = \"\"; }\n    const arg = p[1] ? decodeURIComponent(p[1]) : \"\";\n    this.setState({ rotta: { vista: vista, arg: arg }, tipi: [], inviato: false, mail: \"\" });\n    window.scrollTo(0, 0);\n    try { window.history.replaceState(null, \"\", rotta); } catch (e) {}\n  }\n  leggiRotta() {\n    let h = \"\";\n    try { h = String(window.location.hash || \"\").replace(/^#\\/?/, \"\"); } catch (e) {}\n    const p = h.split(\"/\");\n    let vista = p[0] || \"\";\n    const arg = p[1] ? decodeURIComponent(p[1]) : \"\";\n    const note = [\"\", \"regione\", \"vuota\", \"faq\", \"prostata\", \"chi\", \"contatti\", \"testimonianze\", \"articolo\"];\n    if (note.indexOf(vista) === -1) { vista = \"\"; }\n    return { vista: vista, arg: arg };\n  }\n  vista() { return this.state.rotta.vista; }\n  reg() { return this.state.rotta.arg || \"Lombardia\"; }\n\n  nomiRegioni() {\n    return [\"Abruzzo\",\"Basilicata\",\"Calabria\",\"Campania\",\"Emilia-Romagna\",\"Friuli-Venezia Giulia\",\"Lazio\",\"Liguria\",\"Lombardia\",\"Marche\",\"Molise\",\"Piemonte\",\"Puglia\",\"Sardegna\",\"Sicilia\",\"Toscana\",\"Trentino-Alto Adige\",\"Umbria\",\"Valle d'Aosta\",\"Veneto\"];\n  }\n  conteggi() {\n    const c = {};\n    (window.INIZIATIVE || []).forEach((x) => { c[x.reg] = (c[x.reg] || 0) + 1; });\n    return c;\n  }\n  rottaRegione(n) {\n    const q = this.conteggi()[n] || 0;\n    return \"#/\" + (q > 0 ? \"regione\" : \"vuota\") + \"/\" + encodeURIComponent(n);\n  }\n  etichettaConta(n) {\n    const q = this.conteggi()[n] || 0;\n    if (q === 0) { return \"nessuna iniziativa segnalata\"; }\n    if (q === 1) { return \"1 iniziativa aperta\"; }\n    return q + \" iniziative aperte\";\n  }\n  parola(n, uno, molte) { return n + \" \" + (n === 1 ? uno : molte); }\n\n  disegnaMappa() {\n    // Tutte le mappe presenti nella schermata, non solo la prima.\n    const tutte = Array.prototype.slice.call(document.querySelectorAll(\".mappa\"));\n    if (this.mapEl && this.mapEl.isConnected && tutte.indexOf(this.mapEl) === -1) { tutte.push(this.mapEl); }\n    if (!tutte.length || !window.MappaItalia || !window.MappaItalia.pronta()) { return; }\n    const marca = this.vista() === \"regione\" ? this.reg() : \"\";\n    tutte.forEach((el) => {\n      if (el.querySelector(\"svg\") && el.dataset.reg === marca) { return; }\n      el.dataset.reg = marca;\n      window.MappaItalia.disegna(el, {\n        conteggi: this.conteggi(),\n        attiva: this.vista() === \"regione\" ? this.reg() : null,\n        href: (n) => this.rottaRegione(n),\n        vai: (n) => this.vaiA(this.rottaRegione(n)),\n        etichetta: (n) => this.etichettaConta(n)\n      });\n    });\n  }\n\n  icona(tipo) {\n    const I = {\n      \"Mammografico\": \"M12 3a9 9 0 100 18 9 9 0 000-18M12 10.6a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8\",\n      \"Colon-retto\": \"M6 4c0 4.5 5.5 3.5 5.5 8S5 15.5 5 19h14\",\n      \"Cervice uterina\": \"M12 3.5l7 3v5.2c0 4.2-3 6.9-7 8.3-4-1.4-7-4.1-7-8.3V6.5z\",\n      \"Prostata\": \"M12 3.5c3.2 4.2 5.2 6.4 5.2 9A5.2 5.2 0 0112 17.7 5.2 5.2 0 016.8 12.5c0-2.6 2-4.8 5.2-9z\",\n      \"Melanoma\": \"M12 7.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9M12 2.5v2M12 19.5v2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M2.5 12h2M19.5 12h2M5.2 18.8l1.4-1.4M17.4 6.6l1.4-1.4\",\n      \"Polmone\": \"M12 3.5v9M9 8.5c-2.2 1.2-3.2 3.4-3.2 6.4v5H9v-7M15 8.5c2.2 1.2 3.2 3.4 3.2 6.4v5H15v-7\",\n      \"Osteoporosi\": \"M8 5.5a2.2 2.2 0 00-2.2 2.2A2.2 2.2 0 008 9.9h8a2.2 2.2 0 002.2-2.2A2.2 2.2 0 0016 5.5M8 14.1a2.2 2.2 0 00-2.2 2.2A2.2 2.2 0 008 18.5h8a2.2 2.2 0 002.2-2.2 2.2 2.2 0 00-2.2-2.2M9.5 9.9v4.2M14.5 9.9v4.2\",\n      \"Tiroide\": \"M12 7.5v8M9.2 8c-2.9 0-4.2 2-4.2 4.2S6.3 16.5 9.2 16.5s2.8-2 2.8-4.3S12.1 8 9.2 8M14.8 8c2.9 0 4.2 2 4.2 4.2s-1.3 4.3-4.2 4.3-2.8-2-2.8-4.3S11.9 8 14.8 8\"\n    };\n    return I[tipo] || \"M12 3a9 9 0 100 18 9 9 0 000-18\";\n  }\n  scheda(x) {\n    let cls = \"tag tag-gratis\";\n    if (x.stato === \"a pagamento\") { cls = \"tag tag-paga\"; }\n    if (x.stato === \"su invito\") { cls = \"tag tag-invito\"; }\n    return {\n      tipo: x.tipo, icona: this.icona(x.tipo), titolo: x.titolo, ente: x.ente, dove: x.dove,\n      quando: x.quando, chi: x.chi, tel: x.tel, href: \"tel:\" + x.tel.split(\" \").join(\"\"),\n      tagTesto: x.stato, tagCls: cls,\n      scadenza: this.scadenza(x).testo, scadenzaCls: this.scadenza(x).cls,\n      haScadenza: !!this.scadenza(x).testo,\n      posti: x.posti || \"\", haPosti: !!x.posti\n    };\n  }\n  giorniAllaChiusura(x) {\n    if (!x.chiude) { return null; }\n    const oggi = new Date();\n    oggi.setHours(0, 0, 0, 0);\n    const p = x.chiude.split(\"-\");\n    const fine = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));\n    return Math.round((fine - oggi) / 86400000);\n  }\n  scadenza(x) {\n    const g = this.giorniAllaChiusura(x);\n    if (g === null) { return { testo: \"\", cls: \"\" }; }\n    const MESI = [\"gennaio\",\"febbraio\",\"marzo\",\"aprile\",\"maggio\",\"giugno\",\"luglio\",\"agosto\",\"settembre\",\"ottobre\",\"novembre\",\"dicembre\"];\n    const p = x.chiude.split(\"-\");\n    const data = Number(p[2]) + \" \" + MESI[Number(p[1]) - 1];\n    if (g < 0) { return { testo: \"chiusa\", cls: \"scad scad-chiusa\" }; }\n    if (g === 0) { return { testo: \"ultimo giorno, oggi\", cls: \"scad scad-rossa\" }; }\n    if (g === 1) { return { testo: \"chiude domani\", cls: \"scad scad-rossa\" }; }\n    if (g <= 7) { return { testo: \"chiude fra \" + g + \" giorni\", cls: \"scad scad-rossa\" }; }\n    if (g <= 21) { return { testo: \"chiude il \" + data, cls: \"scad scad-gialla\" }; }\n    return { testo: \"aperta fino al \" + data, cls: \"scad scad-calma\" };\n  }\n\n  testimonianze() {\n    const F = \"https://img.magnific.com/free-photo/\";\n    const foto = [\n      F + \"close-up-portrait-beautiful-smiling-old-woman-blue-shirt_171337-7899.jpg\",\n      F + \"portrait-caucasian-man_641386-12.jpg\",\n      F + \"adult-woman-with-gray-hair-smiling_23-2148277910.jpg\",\n      F + \"portrait-smiley-mature-man_23-2148465219.jpg\",\n      F + \"medium-shot-smiley-woman-portrait_23-2149361949.jpg\",\n      F + \"good-mood-mature-man-burgundy-shirt-looking-positive_259150-56976.jpg\",\n      F + \"portrait-happy-smiley-older-woman_23-2149022611.jpg\",\n      F + \"portrait-man-laughing_23-2148859448.jpg\"\n    ];\n    const lista = this.voci ? this.voci : (this.voci = [\n      { nome: \"Anna R.\", ruolo: \"58 anni, Bologna\", testo: \"Grazie a Screening Italia ho trovato una giornata di screening a due fermate di autobus da casa. Prima cercavo sui siti delle ASL e non capivo mai se l\\u2019iniziativa fosse ancora aperta. Qui era tutto in una schermata: dove, quando, e il numero da chiamare.\" },\n      { nome: \"Marco T.\", ruolo: \"34 anni, figlio di un utente\", testo: \"Mio padre ha 71 anni e non usa internet. Ho aperto il sito, scelto la Puglia, spuntato colon-retto e in un minuto avevo il numero da chiamare. L\\u2019ho prenotato io per lui mentre eravamo al telefono.\" },\n      { nome: \"Giulia S.\", ruolo: \"46 anni, Torino\", testo: \"Stavo per prenotare una mammografia in una clinica privata a 130 euro. Ho scoperto qui che nella mia zona c\\u2019era la stessa cosa, gratuita. Dormo sonni tranquilli grazie alla prevenzione, e senza spendere.\" },\n      { nome: \"Salvatore P.\", ruolo: \"63 anni, Palermo\", testo: \"Il sito \\u00e8 chiaro anche per chi come me non \\u00e8 pratico. Caratteri grandi, poche cose per pagina, e il pulsante per ingrandire il testo mi ha risolto la giornata.\" },\n      { nome: \"Chiara M.\", ruolo: \"41 anni, figlia di un\\u2019utente\", testo: \"Ho aiutato mia madre a capire cosa fosse il kit del colon-retto: la spiegazione qui era pi\\u00f9 comprensibile della lettera arrivata a casa. Le ho letto la pagina al telefono e ha fatto tutto da sola.\" },\n      { nome: \"Davide L.\", ruolo: \"52 anni, Verona\", testo: \"Cercavo un controllo della prostata e non sapevo che non esistesse l\\u2019invito. Averlo scritto chiaro, senza allarmismi, mi ha fatto prendere appuntamento dal medico invece di rimandare un altro anno.\" },\n      { nome: \"Rosa D.\", ruolo: \"67 anni, Napoli\", testo: \"Non mi era mai arrivata la lettera. Qui ho letto cosa fare e a chi telefonare: in mezz\\u2019ora avevo l\\u2019appuntamento. Pensavo di aver perso il turno.\" },\n      { nome: \"Federico B.\", ruolo: \"29 anni, figlio di un utente\", testo: \"Di solito nei siti pubblici mi perdo. Questo si capisce al primo colpo: clicchi la regione sulla mappa e vedi solo quello che ti serve. L\\u2019ho girato a tutta la famiglia.\" }\n    ]);\n    return lista.map((t, i) => ({ nome: t.nome, ruolo: t.ruolo, testo: t.testo, foto: foto[i % foto.length], slot: \"testi-\" + i }));\n  }\n  corpi() {\n    return {\n      \"faq-1\": [\n        { h: \"Perch\\u00e9 la lettera pu\\u00f2 non arrivare\", p: [\"L\\u2019invito viene spedito all\\u2019indirizzo che risulta all\\u2019anagrafe sanitaria, non a quello dove abiti di fatto. Se hai cambiato casa senza aggiornare la residenza, o se il nome sul citofono non corrisponde, la lettera torna al mittente.\", \"Capita anche per un semplice mancato recapito postale. In tutti questi casi resti comunque nell\\u2019elenco delle persone da invitare: non sei stato escluso.\"] , chiave: \"Non sei stato escluso: la tua posizione resta nell’elenco delle persone da invitare.\" },\n        { h: \"Cosa fare, in concreto\", p: [\"Chiama il centro screening della tua azienda sanitaria e di\\u2019 che non hai ricevuto l\\u2019invito: il numero si trova sul sito dell\\u2019ASL alla voce screening, oppure lo chiedi in farmacia.\", \"Tieni a portata di mano la tessera sanitaria: servono codice fiscale e indirizzo aggiornato. Nella stessa telefonata puoi gi\\u00e0 fissare l\\u2019appuntamento.\"] , corsivo: \"Chiedi anche di aggiornare l’indirizzo: eviti che salti anche il prossimo invito.\" },\n        { h: \"Hai perso il turno?\", p: [\"No. Il programma richiama a intervalli regolari e l\\u2019adesione fuori invito \\u00e8 prevista: l\\u2019esame resta gratuito e senza impegnativa.\"] , chiave: \"L’esame resta gratuito e senza impegnativa, anche fuori invito.\" }\n      ],\n      \"faq-3\": [\n        { h: \"L\\u2019invito non \\u00e8 un buono da esibire\", p: [\"La lettera serve a informarti, non \\u00e8 un titolo di accesso. Se l\\u2019hai buttata, persa o cestinata per errore, la prenotazione resta possibile: la tua posizione \\u00e8 registrata nell\\u2019elenco del centro screening.\"] , chiave: \"La lettera informa, non autorizza: senza di essa la prenotazione resta possibile.\" },\n        { h: \"Come recuperare l\\u2019appuntamento\", p: [\"Telefona al centro screening della tua ASL. Comunichi nome, codice fiscale e data di nascita, e ti viene assegnata una nuova data.\", \"Se nella lettera c\\u2019era un appuntamento gi\\u00e0 fissato e non ci sei andato, dillo: viene semplicemente riprogrammato.\"] , corsivo: \"Una telefonata basta: non serve ripresentare domanda né passare dal medico.\" },\n        { h: \"Se non ricordi di quale ASL sei\", p: [\"Fa riferimento al comune di residenza. In farmacia o dal medico di medicina generale te lo dicono in un minuto.\"]  }\n      ],\n      \"faq-4\": [\n        { h: \"Ogni quanto si fa\", p: [\"Nel programma pubblico la mammografia si ripete ogni due anni. \\u00c8 l\\u2019intervallo su cui il programma \\u00e8 costruito: pi\\u00f9 spesso non porta benefici dimostrati, pi\\u00f9 raramente riduce l\\u2019efficacia della diagnosi precoce.\"] , chiave: \"Due anni è l’intervallo su cui il programma è costruito.\" },\n        { h: \"Da quale et\\u00e0 \\u00e8 gratuita\", p: [\"La fascia invitata comprende in genere le donne fra i 50 e i 69 anni; diverse regioni la estendono dai 45 ai 74. Dentro la fascia prevista l\\u2019esame \\u00e8 gratuito e non richiede impegnativa.\", \"Fuori dalla fascia il controllo pu\\u00f2 comunque essere indicato: se hai familiarit\\u00e0 o hai notato qualcosa, parlane col medico senza aspettare l\\u2019invito.\"] , chiave: \"Dentro la fascia prevista l’esame è gratuito e non richiede impegnativa.\" },\n        { h: \"Come ci si prepara\", p: [\"Non serve digiuno n\\u00e9 alcuna preparazione. Meglio evitare deodoranti o talco sotto le ascelle il giorno dell\\u2019esame, e portare con te le mammografie precedenti se le hai.\"] , corsivo: \"Porta con te le mammografie precedenti: il confronto è più informativo del singolo esame.\" }\n      ],\n      \"faq-5\": [\n        { h: \"Che cosa cerca il kit\", p: [\"Cerca tracce di sangue non visibili nelle feci, un segno che pu\\u00f2 comparire molto prima dei sintomi. Non \\u00e8 un esame che diagnostica un tumore: indica se serve approfondire con una colonscopia.\"] , chiave: \"Non diagnostica un tumore: dice se serve approfondire.\" },\n        { h: \"Come si usa\", p: [\"Il kit \\u00e8 una provetta con un bastoncino nel tappo. Raccogli un piccolo campione di feci sfiorando la superficie in tre punti diversi, richiudi bene e conserva in frigorifero fino alla riconsegna.\", \"Non serve dieta, non serve sospendere farmaci. Evita la raccolta durante il ciclo mestruale o in presenza di emorroidi sanguinanti: aspetta qualche giorno.\"] , corsivo: \"Niente dieta, niente sospensione di farmaci.\" },\n        { h: \"Dove si ritira e si riporta\", p: [\"Nella maggior parte delle regioni si ritira e si riconsegna in farmacia, gratuitamente. In alcune arriva a casa con la lettera di invito. L\\u2019esito arriva per posta entro poche settimane.\"] , chiave: \"Il ritiro e la riconsegna in farmacia sono gratuiti.\" }\n      ],\n      \"faq-6\": [\n        { h: \"Gratuito\", p: [\"Sono gli esami del programma pubblico rivolti a una fascia di et\\u00e0 precisa: mammella, colon-retto e cervice uterina. Non si paga nulla, non serve impegnativa, e sei tu a essere chiamato.\"] , chiave: \"Non si paga nulla, e sei tu a essere chiamato.\" },\n        { h: \"Su invito\", p: [\"Vuol dire che ci si accede solo se convocati, perch\\u00e9 il programma segue un calendario per fasce di et\\u00e0. Se rientri nei requisiti ma l\\u2019invito non \\u00e8 arrivato, puoi chiamare e aderire comunque.\"] , chiave: \"Se rientri nei requisiti ma l’invito non è arrivato, puoi aderire comunque.\" },\n        { h: \"A pagamento\", p: [\"Sono controlli fuori programma: prescritti dal medico con ticket, oppure privati. Nelle giornate organizzate da ospedali e associazioni gli stessi esami sono spesso gratuiti: le trovi elencate qui, regione per regione.\"] , corsivo: \"Nelle giornate organizzate lo stesso esame è spesso gratuito.\" }\n      ],\n      \"faq-7\": [\n        { h: \"Chi ti prende in carico\", p: [\"Il programma di screening segue la residenza. Appena la nuova residenza \\u00e8 registrata, l\\u2019azienda sanitaria del comune dove sei andato ad abitare ti inserisce nei suoi elenchi e ti invita quando tocca a te.\"] , chiave: \"Il programma di screening segue la residenza.\" },\n        { h: \"I tempi, e cosa fare nel frattempo\", p: [\"Il passaggio non \\u00e8 immediato: fra il cambio di residenza e il primo invito possono passare mesi. Se nel frattempo il tuo turno scade, chiama il centro screening della nuova ASL e chiedi di aderire.\", \"Porta con te gli esiti degli esami fatti prima: servono a capire a che punto del percorso ti trovi ed evitano di ripetere un esame gi\\u00e0 fatto.\"] , corsivo: \"Gli esiti precedenti valgono: portarli evita di ripetere un esame già fatto.\" }\n      ],\n      \"faq-8\": [\n        { h: \"Che cosa vuol dire\", p: [\"Vuol dire che l\\u2019esame ha mostrato qualcosa che va guardato meglio, non che \\u00e8 stato trovato un tumore. Gli esami di screening sono costruiti per essere prudenti: preferiscono richiamare qualche persona in pi\\u00f9 piuttosto che lasciare passare qualcosa.\"] , chiave: \"Vuol dire guardare meglio, non che sia stato trovato un tumore.\" },\n        { h: \"Che cosa succede adesso\", p: [\"Il centro screening ti contatta per un secondo esame, pi\\u00f9 accurato del primo: una mammografia di approfondimento o un\\u2019ecografia, una colonscopia, una colposcopia, a seconda del programma. Anche questo passaggio \\u00e8 gratuito.\", \"Nella maggior parte dei casi l\\u2019approfondimento chiude la questione e si torna al calendario normale.\"] , chiave: \"Anche l’approfondimento è gratuito.\" },\n        { h: \"Quanto si aspetta\", p: [\"I percorsi di approfondimento hanno tempi riservati, in genere poche settimane. Se l\\u2019appuntamento tarda, chiama il centro screening: la priorit\\u00e0 \\u00e8 prevista dal programma.\"] , corsivo: \"Se l’appuntamento tarda, chiama: la priorità è prevista dal programma.\" }\n      ]\n    };\n  }\n  domande() {\n    return [\n      { id: \"faq-1\", foto: \"https://img.magnific.com/free-photo/happy-mature-woman-her-doctor-communicating-while-going-through-paperwork-hospital-hallway_637285-5300.jpg\", sommario: \"La posizione è recuperabile e il turno non viene perso.\", cat: \"Inviti e lettere\", data: \"28 agosto 2026\", titolo: \"Mancato recapito della lettera di invito: come procedere\", href: \"#/articolo/faq-1\", chiavi: \"invito lettera posta asl convocazione\" },\n      { id: \"faq-2\", foto: \"https://img.magnific.com/free-photo/positive-man-with-grey-hair-light-shirt-jeans-with-camera-laughing-with-blonde-lady-hat-sunglasses-striped-blue-shirt-park_197531-19160.jpg\", sommario: \"Non è previsto invito: il primo passo del controllo spetta a te.\", cat: \"Prostata\", data: \"21 agosto 2026\", titolo: \"Screening della prostata: a chi \\u00e8 rivolto e da quale et\\u00e0\", href: \"#/prostata\", chiavi: \"psa uomini urologo eta\" },\n      { id: \"faq-3\", foto: \"https://img.magnific.com/free-photo/portrait-female-health-specialist-working-with-laptop-plan-patient-appointment-medical-office-general-practitioner-using-medication-notes-help-with-diagnosis-treatment_482257-45642.jpg\", sommario: \"Sì: il recapito di riferimento resta quello dell’azienda sanitaria.\", cat: \"Inviti e lettere\", data: \"14 agosto 2026\", titolo: \"Invito smarrito: \\u00e8 ancora possibile prenotare?\", href: \"#/articolo/faq-3\", chiavi: \"invito perso prenotare numero verde\" },\n      { id: \"faq-4\", foto: \"https://img.magnific.com/free-photo/old-grey-haired-female-cabinet-modern-clinic_7502-9557.jpg\", sommario: \"Con cadenza biennale, gratuita nella fascia di età prevista.\", cat: \"Mammografia\", data: \"7 agosto 2026\", titolo: \"Mammografia: periodicit\\u00e0 ed et\\u00e0 di accesso gratuito\", href: \"#/articolo/faq-4\", chiavi: \"seno donne gratis eta due anni\" },\n      { id: \"faq-5\", foto: \"https://img.magnific.com/free-photo/thank-you-your-prescription_329181-2225.jpg\", sommario: \"Si ritira e si riconsegna in farmacia: la raccolta richiede pochi minuti.\", cat: \"Colon-retto\", data: \"31 luglio 2026\", titolo: \"Kit per la ricerca del sangue occulto: uso e riconsegna\", href: \"#/articolo/faq-5\", chiavi: \"kit feci farmacia sangue occulto\" },\n      { id: \"faq-6\", foto: \"https://img.magnific.com/free-photo/thank-you-your-visit-my-office_329181-2204.jpg\", sommario: \"Tre condizioni che determinano il costo e le modalità di accesso.\", cat: \"Come funziona\", data: \"24 luglio 2026\", titolo: \"Gratuito, a pagamento, su invito: le differenze\", href: \"#/articolo/faq-6\", chiavi: \"costo ticket invito differenza\" },\n      { id: \"faq-7\", foto: \"https://img.magnific.com/free-photo/charming-woman-with-short-hairstyle-hat-blue-blouse-holds-map-points-side-smiles-with-grey-haired-man-with-camera-park_197531-19155.jpg\", sommario: \"La presa in carico passa all’azienda sanitaria del nuovo domicilio.\", cat: \"Come funziona\", data: \"17 luglio 2026\", titolo: \"Trasferimento di residenza: a quale azienda sanitaria rivolgersi\", href: \"#/articolo/faq-7\", chiavi: \"trasferimento residenza regione asl nuova\" },\n      { id: \"faq-8\", foto: \"https://img.magnific.com/free-photo/senior-woman-answering-doctor-questions-examination-hospital-room_482257-8442.jpg\", sommario: \"Non indica una diagnosi: comporta un secondo accertamento.\", cat: \"Come funziona\", data: \"10 luglio 2026\", titolo: \"Esito \\u00abda approfondire\\u00bb: che cosa comporta\", href: \"#/articolo/faq-8\", chiavi: \"esito risultato approfondimento richiamo\" }\n    ];\n  }\n  normalizza(s) {\n    return String(s).toLowerCase().normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\");\n  }\n\n  renderVals() {\n    const vista = this.vista();\n    const reg = this.reg();\n    const dati = window.INIZIATIVE || [];\n    const conteggi = this.conteggi();\n\n    // --- regione ---\n    const tutte = dati.filter((x) => x.reg === reg);\n    const sel = this.state.tipi;\n    const nomiTipi = [];\n    tutte.forEach((x) => { if (nomiTipi.indexOf(x.tipo) === -1) { nomiTipi.push(x.tipo); } });\n    // Massimo sei filtri: oltre quel numero la fila diventa illeggibile.\n    // Restano i sei tipi con piu iniziative nella regione.\n    nomiTipi.sort((a, b) => {\n      const d = tutte.filter((x) => x.tipo === b).length - tutte.filter((x) => x.tipo === a).length;\n      return d !== 0 ? d : a.localeCompare(b);\n    });\n    nomiTipi.splice(6);\n    nomiTipi.sort();\n    const scelte = nomiTipi.map((t) => {\n      const n = tutte.filter((x) => x.tipo === t).length;\n      const on = sel.indexOf(t) !== -1;\n      return {\n        nome: t, on: on ? \"true\" : \"false\", icona: this.icona(t),\n        conta: this.parola(n, \"iniziativa\", \"iniziative\"),\n        cls: on ? \"scelta on\" : \"scelta\",\n        pick: () => this.setState((s) => ({\n          tipi: s.tipi.indexOf(t) === -1 ? s.tipi.concat([t]) : s.tipi.filter((x) => x !== t)\n        }))\n      };\n    });\n    // Chi chiude prima sta in cima: e l'informazione che fa agire.\n    const viste = (sel.length ? tutte.filter((x) => sel.indexOf(x.tipo) !== -1) : tutte)\n      .slice().sort((a, b) => String(a.chiude || \"9\").localeCompare(String(b.chiude || \"9\")));\n    const inScadenza = viste.filter((x) => {\n      const g = this.giorniAllaChiusura(x);\n      return g !== null && g >= 0 && g <= 7;\n    }).length;\n    let quante = \"Nessuna iniziativa aperta in \" + reg + \".\";\n    if (tutte.length) {\n      quante = sel.length\n        ? this.parola(viste.length, \"iniziativa aperta\", \"iniziative aperte\") + \" per la tua scelta.\"\n        : this.parola(tutte.length, \"iniziativa aperta\", \"iniziative aperte\") + \" in \" + reg + \". Seleziona uno screening per restringere l’elenco.\";\n    }\n\n    // --- domande frequenti ---\n    const tutteFaq = this.domande();\n    const ago = this.normalizza(this.state.q).trim();\n    const cat = this.state.cat;\n    const nomiCat = [];\n    tutteFaq.forEach((a) => { if (nomiCat.indexOf(a.cat) === -1) { nomiCat.push(a.cat); } });\n    const categorie = [{ nome: \"Tutti\", val: null }].concat(nomiCat.map((c) => ({ nome: c, val: c }))).map((c) => ({\n      nome: c.nome,\n      cls: cat === c.val ? \"filtro on\" : \"filtro\",\n      pick: () => this.setState({ cat: c.val })\n    }));\n    const trovate = tutteFaq.filter((a) => {\n      if (cat && a.cat !== cat) { return false; }\n      if (!ago) { return true; }\n      return this.normalizza(a.titolo + \" \" + a.cat + \" \" + a.chiavi).indexOf(ago) !== -1;\n    });\n    let quanteFaq = this.parola(trovate.length, \"risposta\", \"risposte\");\n    if (trovate.length === 0) { quanteFaq = \"Nessuna risposta\"; }\n    quanteFaq = quanteFaq + (cat ? \" in \\u00ab\" + cat + \"\\u00bb\" : \"\") + (ago ? \" per \\u00ab\" + this.state.q + \"\\u00bb\" : \"\") + \".\";\n\n    return {\n      // navigazione\n      navReg: (vista === \"regione\" || vista === \"vuota\") ? \"page\" : \"false\",\n      navTesti: vista === \"testimonianze\" ? \"page\" : \"false\",\n      navChi: vista === \"chi\" ? \"page\" : \"false\",\n      navContatti: vista === \"contatti\" ? \"page\" : \"false\",\n      navFaq: (vista === \"faq\" || vista === \"prostata\" || vista === \"articolo\") ? \"page\" : \"false\",\n      hrefIniziative: this.rottaRegione(\"Lombardia\"),\n      vistaHome: vista === \"\",\n      vistaRegione: vista === \"regione\",\n      vistaVuota: vista === \"vuota\",\n      vistaFaq: vista === \"faq\",\n      vistaProstata: vista === \"prostata\",\n      vistaChi: vista === \"chi\",\n      vistaContatti: vista === \"contatti\",\n\n      // home\n      nIniziative: String(dati.length || 47),\n      nRegioni: String(Object.keys(conteggi).length || 18),\n      nTipi: String(new Set(dati.map((x) => x.tipo)).size || 8),\n      aggiornato: \"3 settembre\",\n      vaiAllaMappa: () => {\n        const el = document.querySelector(\"#trova\");\n        if (el) { window.scrollTo(0, el.getBoundingClientRect().top + window.pageYOffset - 70); }\n      },\n      mappaRef: this.mappaRef,\n      erroreMappa: !!this.state.erroreMappa,\n      regioni: this.nomiRegioni().map((n) => ({ nome: n, href: this.rottaRegione(n) })),\n      faqHome: tutteFaq.slice(0, 3).map((a) => ({ slot: \"home-\" + a.id, cat: a.cat, data: a.data, titolo: a.titolo, sommario: a.sommario, foto: a.foto, href: a.href })),\n\n      // regione\n      reg: reg,\n      hrefVuota: \"#/vuota/\" + encodeURIComponent(reg),\n      apertura: tutte.length\n        ? \"Seleziona gli screening che ti interessano: di seguito sono riportate le sole iniziative attualmente attive, con l’ente organizzatore e il recapito telefonico.\"\n        : \"Per questa regione non risultano iniziative segnalate.\",\n      elencoRegioni: this.nomiRegioni().map((n) => {\n        const q = conteggi[n] || 0;\n        return { nome: n, etichetta: n + \" \\u2014 \" + (q ? this.parola(q, \"iniziativa\", \"iniziative\") : \"nessuna iniziativa\") };\n      }),\n      vaiA: (e) => { this.vaiA(this.rottaRegione(e.target.value)); },\n      scelte: scelte,\n      azzera: () => this.setState({ tipi: [] }),\n      quante: quante,\n      titoloElenco: tutte.length === 0\n        ? \"Nessuna iniziativa in \" + reg\n        : (sel.length ? \"Le iniziative corrispondenti alla tua scelta\" : \"Tutte le iniziative attive in \" + reg),\n      iniziative: viste.map((x) => this.scheda(x)),\n      avvisoScadenza: inScadenza > 0\n        ? (inScadenza === 1 ? \"Una di queste chiude entro una settimana.\" : inScadenza + \" di queste chiudono entro una settimana.\")\n        : \"\",\n      haAvvisoScadenza: inScadenza > 0,\n      vuotoPerScelta: tutte.length > 0 && viste.length === 0,\n\n      // regione vuota\n      mail: this.state.mail,\n      inviato: this.state.inviato,\n      daCompilare: !this.state.inviato,\n      scriviMail: (e) => this.setState({ mail: e.target.value }),\n      inviaMail: () => { if (this.state.mail) { this.setState({ inviato: true }); } },\n\n      // domande frequenti\n      q: this.state.q,\n      haQ: this.state.q.length > 0,\n      scrivi: (e) => this.setState({ q: e.target.value }),\n      pulisci: () => this.setState({ q: \"\" }),\n      categorie: categorie,\n      quanteFaq: quanteFaq,\n      vuotoFaq: trovate.length === 0,\n      risposte: trovate.map((a) => ({ slot: a.id, cat: a.cat, data: a.data, titolo: a.titolo, sommario: a.sommario, foto: a.foto, href: a.href })),\n\n      // articolo\n      vistaArticolo: vista === \"articolo\",\n      art: (() => {\n        const id = this.state.rotta.arg || \"faq-1\";\n        const d = tutteFaq.filter((x) => x.id === id)[0] || tutteFaq[0];\n        const corpo = (this.corpi()[d.id] || []).map((s) => ({\n          h: s.h, p: s.p, chiave: s.chiave || \"\", corsivo: s.corsivo || \"\",\n          haChiave: !!s.chiave, haCorsivo: !!s.corsivo\n        }));\n        return {\n          slot: \"art-\" + d.id, foto: d.foto, cat: d.cat, titolo: d.titolo,\n          sommario: d.sommario, data: d.data, corpo: corpo\n        };\n      })(),\n\n      // testimonianze\n      vistaTesti: vista === \"testimonianze\",\n      testiGiro: this.testimonianze(),\n      testiTutte: this.testimonianze(),\n\n      // modulo dei contatti\n      mNome: this.state.mNome || \"\",\n      mMail: this.state.mMail || \"\",\n      mTipo: this.state.mTipo || \"Segnalo un\\u2019iniziativa\",\n      mTesto: this.state.mTesto || \"\",\n      msgInviato: !!this.state.msgInviato,\n      msgDaCompilare: !this.state.msgInviato,\n      scriviNome: (e) => this.setState({ mNome: e.target.value }),\n      scriviIndirizzo: (e) => this.setState({ mMail: e.target.value }),\n      scriviTipo: (e) => this.setState({ mTipo: e.target.value }),\n      scriviTesto: (e) => this.setState({ mTesto: e.target.value }),\n      inviaModulo: () => {\n        if (this.state.mMail && this.state.mTesto) { this.setState({ msgInviato: true }); }\n      },\n\n      // articolo prostata\n      prostata: dati.filter((x) => x.tipo === \"Prostata\").map((x) => this.scheda(x))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
