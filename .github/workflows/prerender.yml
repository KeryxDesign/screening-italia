# Rigenera _pre/ (testi veri per chi non esegue JS) con le iniziative di quel momento.
# Per ora SOLO a mano (Actions > Rigenera pagine statiche > Run workflow): la schedulazione notturna
# resta spenta finche Davide non la approva. Per accenderla togliere il commento a "schedule".
name: Rigenera pagine statiche
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 3 * * *'   # ogni notte, 03:30 UTC
permissions:
  contents: write
jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Installa playwright-core e Chrome
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chrome
      - name: Rigenera
        run: |
          node scripts/serve.js . 8099 &
          sleep 2
          node scripts/prerender.js http://localhost:8099
      - name: Controllo (nessuna copia vuota)
        run: test "$(find _pre -name '*.html' -size +20k | wc -l)" -ge 50
      - name: Commit se cambia qualcosa
        run: |
          git config user.name "prerender-bot"
          git config user.email "prerender-bot@users.noreply.github.com"
          git add _pre
          git diff --cached --quiet || (git commit -m "Rigenera _pre/ (iniziative aggiornate)" && git push)
