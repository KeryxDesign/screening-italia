<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina non trovata · Screening Italia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/marchio/favicon-32.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--carta:#EFFAF9;--inchiostro:#14202B;--verde:#0B6E73;--verde-scuro:#07494D;--terracotta:#A63D17}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:var(--carta);color:var(--inchiostro);font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;font-size:19px;line-height:1.65}
main{max-width:520px;width:100%}
.occhiello{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--verde);margin:0 0 8px}
h1{font-size:32px;line-height:1.24;letter-spacing:-.012em;font-weight:600;margin:0 0 16px}
p{margin:0 0 24px}
.azioni{display:flex;flex-wrap:wrap;gap:12px}
a.bt{display:inline-block;padding:14px 24px;border-radius:10px;font-weight:700;text-decoration:none;font-size:18px;line-height:1.3}
a.bt-1{background:var(--terracotta);color:#fff;border:2px solid var(--terracotta)}
a.bt-1:hover{background:#8A3012;border-color:#8A3012}
a.bt-2{background:#fff;color:var(--verde-scuro);border:2px solid var(--verde)}
a.bt-2:hover{background:#D8F2F0}
a:focus-visible{outline:3px solid var(--inchiostro);outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="occhiello">Errore 404</p>
<h1>Questa pagina non esiste</h1>
<p>L’indirizzo che hai aperto non porta a nessuna pagina del sito. Può essere scritto male, oppure la pagina è stata spostata.</p>
<div class="azioni">
<a class="bt bt-1" href="/">Torna alla home</a>
<a class="bt bt-2" href="/articoli">Leggi gli articoli</a>
</div>
</main>
</body>
</html>
